sys:[
{q:"Design a recommendation system for YouTube.",a:"<b>Candidate generation</b>: collaborative filtering (user history → ANN search in video embeddings), content-based (video features), trending. <b>Ranking</b>: deep neural network, features: user history, video metadata, context (time, device), engagement signals. <b>Re-ranking</b>: diversity, freshness, policy filters. <b>Training</b>: implicit feedback (watch time > CTR alone). <b>Serving</b>: two-tower model for fast ANN; feature store for real-time features."},
{q:"Design a fraud detection system.",a:"<b>Features</b>: transaction amount, merchant, location, device, time, velocity (n transactions in last hour), account age. <b>Models</b>: gradient boosted trees (high precision), neural networks for sequential patterns. <b>Rules engine</b>: hard thresholds for obvious fraud. <b>Two-stage</b>: fast rule-based filter → slower ML model. <b>Online learning</b>: adapt to new fraud patterns. <b>Labeling</b>: chargebacks as ground truth (delayed). Handle extreme class imbalance (0.1% fraud)."},
{q:"How would you approach a time series forecasting problem?",a:"(1) EDA: trend, seasonality, stationarity (ADF test). (2) Feature engineering: lags, rolling stats, time features, external signals. (3) Train/test split: chronological only. (4) Models: ARIMA/SARIMA (statistical), LightGBM with lag features (strong baseline), LSTM/Transformer for multivariate. (5) Metrics: MAE, RMSE, MAPE, SMAPE. (6) Handle: missing values, outliers, multiple seasonalities (Prophet). (7) Cross-validation: time-series CV with expanding window."},
{q:"How would you build a spam detection system?",a:"<b>Features</b>: TF-IDF, word embeddings, metadata (sender, reply-to, headers), URL analysis, email structure. <b>Models</b>: Naive Bayes (strong baseline for text), gradient boosting, fine-tuned BERT for content. <b>Pipeline</b>: fast rule-based filter first (known spam domains) → ML classifier → confidence threshold. <b>Challenges</b>: adversarial (spammers adapt), concept drift (retrain frequently), high precision needed (avoid losing real emails). Active learning for edge cases."},
{q:"Design a customer churn prediction model.",a:"<b>Label</b>: customer cancels in next 30/60/90 days. <b>Features</b>: usage frequency, feature adoption, support tickets, payment history, engagement score, NPS, contract type, competitor signals. <b>Model</b>: gradient boosting (XGBoost). <b>Evaluation</b>: AUC-ROC, precision@K (top customers to target). <b>Action</b>: rank at-risk customers → intervention (discount, outreach). <b>Business metric</b>: revenue saved vs intervention cost. Retrain monthly."},
{q:"What is model drift and how do you handle it?",a:"<b>Data drift (covariate shift)</b>: input distribution changes (P(X) changes). <b>Concept drift</b>: relationship between X and y changes (P(y|X) changes). <b>Label drift</b>: output distribution changes.<br>Detection: PSI (population stability index), KL divergence on feature distributions, monitoring prediction distribution, performance metrics on recent data.<br>Handling: frequent retraining, online learning, data weighting (recent data more weight), model ensembles."},
{q:"How would you handle large-scale data for training?",a:"(1) Distributed training: data parallelism (split batches across GPUs), model parallelism (split model across GPUs). (2) Efficient data loading: prefetching, parallel workers, TFRecords/Parquet format. (3) Gradient accumulation: simulate large batch with small GPU memory. (4) Mixed precision (FP16): halves memory, speeds training. (5) Feature stores for pre-computed features. (6) Incremental/online learning for streaming data."},
{q:"How do you deal with noisy data?",a:"(1) Data cleaning: rule-based filters, outlier removal. (2) Robust loss functions: Huber loss, MAE. (3) Label smoothing: soft labels instead of hard 0/1 (prevents overconfidence on noisy labels). (4) Confident learning (Cleanlab): identifies mislabeled examples via cross-validation predictions. (5) Noise-robust models: tree ensembles are relatively robust. (6) Data quality monitoring. (7) Re-label or collect more data for noisy classes."},
{q:"How do you deploy an ML model in production?",a:"(1) Serialize model: pickle, ONNX, TorchScript, SavedModel. (2) Containerize: Docker. (3) Serving framework: FastAPI REST, TorchServe, TF Serving, Triton (for high throughput). (4) CI/CD pipeline: automated tests, shadow deployment. (5) Gradual rollout: canary (5% traffic), A/B test. (6) Feature store: consistent features between training and serving. (7) Monitoring: latency, throughput, prediction distribution, data drift. (8) Model registry: versioning."},
{q:"How do you monitor a model in production?",a:"(1) <b>Operational metrics</b>: latency (p50/p99), throughput, error rate, memory/CPU. (2) <b>Data quality</b>: feature distribution drift (PSI), missing rate, outlier rate. (3) <b>Prediction monitoring</b>: output distribution, confidence scores. (4) <b>Business metrics</b>: revenue, conversions, CTR. (5) <b>Model performance</b>: when labels available (delayed), accuracy/AUC. Tools: WhyLogs, Evidently, Arize, MLflow, Prometheus + Grafana. Set alerts for anomalies."},
{q:"How would you deploy a model with low-latency requirements?",a:"(1) Model optimization: quantization (INT8 → 2-4x faster), pruning, knowledge distillation (smaller model). (2) Serving hardware: GPU for neural networks, CPU for trees (faster for small batches). (3) In-process inference: avoid network hop (embed model in app). (4) Batching with timeout. (5) TensorRT/ONNX Runtime for optimized inference. (6) Caching: cache predictions for repeated inputs. (7) Async/parallel serving. Target: <100ms p99 for real-time."},
{q:"What is model explainability?",a:"Model explainability means understanding why a model makes a specific prediction. Importance: (1) Trust/debugging — is the model using the right features? (2) Regulatory compliance (GDPR right to explanation). (3) Bias detection. (4) Business insights.<br><br><b>Global explanations</b>: feature importance (overall). <b>Local explanations</b>: why this prediction? Methods: SHAP (game theory, model-agnostic), LIME, attention visualization, integrated gradients, partial dependence plots."},
{q:"Explain MLOps and its key components.",a:"MLOps applies DevOps principles to ML, making ML systems reliable and maintainable. Key components: (1) Data versioning (DVC, Delta Lake). (2) Experiment tracking (MLflow, W&B). (3) Model registry (MLflow, SageMaker). (4) CI/CD pipelines for models (GitHub Actions, Kubeflow). (5) Feature store (Feast, Tecton). (6) Model monitoring and retraining triggers. (7) Infrastructure as code. Bridges gap between Data Science and Engineering."},
{q:"What is a feature store?",a:"A feature store is a centralized repository for ML features that ensures consistency between training and serving. Solves: training-serving skew (same feature computation in both), feature reuse across teams, point-in-time correct joins (prevent data leakage). Has: offline store (batch training) and online store (low-latency serving). Examples: Feast (open-source), Tecton, SageMaker Feature Store, Vertex AI Feature Store."},
{q:"What are common challenges when deploying ML models?",a:"(1) Training-serving skew: different preprocessing in training vs production. (2) Model staleness / concept drift. (3) Latency requirements. (4) Scalability (handling 1000s of requests/second). (5) Monitoring and alerting. (6) Versioning and rollbacks. (7) Cold start for recommendation systems. (8) Data pipeline failures. (9) Dependency management. (10) A/B testing infrastructure. (11) Regulatory/compliance requirements."},
{q:"What is Multimodal Fusion: Early vs Late?",a:"<b>Early fusion (feature-level)</b>: concatenate features from different modalities before the model. Simple but modality-specific preprocessing needed; may lose modality-specific structure.<br><br><b>Late fusion (decision-level)</b>: train separate models per modality, combine predictions (average, weighted, or learned). Modality-specific processing; handles missing modalities gracefully; higher compute but modular.<br><br>Intermediate fusion: share some layers, fuse in the middle. Often best for cross-modal attention."},
{q:"Model compression techniques.",a:"(1) <b>Quantization</b>: lower precision (FP32→INT8). (2) <b>Pruning</b>: remove low-magnitude weights (unstructured) or entire filters (structured). (3) <b>Knowledge Distillation</b>: train small 'student' to mimic large 'teacher' — student learns teacher's soft outputs. (4) <b>Low-rank factorization</b>: decompose weight matrices (LoRA). (5) <b>Weight sharing</b>: multiple weights share same value. (6) Architecture search (NAS): find efficient architectures automatically."},

{q:"Explain the Bias-Variance Tradeoff.",a:"Total error = Bias² + Variance + Irreducible Noise. <b>Bias</b>: systematic error from wrong model assumptions. High bias → underfits. <b>Variance</b>: sensitivity to training data fluctuations. High variance → overfits. Decreasing one often increases the other. Solution: find the sweet spot (optimal model complexity) via cross-validation. Regularization, ensemble methods (bagging reduces variance, boosting reduces bias) manage this tradeoff."},
{q:"Explain different probability distributions.",a:"<b>Normal</b>: bell curve, symmetric, defined by μ and σ². Most natural phenomena. <b>Binomial</b>: count of successes in n Bernoulli trials. <b>Poisson</b>: count of events in fixed interval. <b>Uniform</b>: all outcomes equally likely. <b>Exponential</b>: time between Poisson events. <b>Bernoulli</b>: single trial, 0 or 1. <b>Gamma</b>: generalizes exponential. <b>Beta</b>: probability values [0,1]. <b>Log-normal</b>: log of variable is normal."},
{q:"What is the Normal distribution?",a:"Normal (Gaussian) distribution: f(x) = (1/σ√2π) exp(-(x-μ)²/2σ²). Symmetric, bell-shaped. Defined by mean μ and std σ. Empirical rule: 68% within 1σ, 95% within 2σ, 99.7% within 3σ. Central Limit Theorem: sum of many independent RVs → Normal regardless of their distribution. Foundation of many statistical tests (z-test, t-test, linear regression assumptions)."},
{q:"What is an Exponential distribution?",a:"Exponential distribution models time between events in a Poisson process. PDF: f(x) = λe^(-λx), x≥0, where λ is the rate parameter. Mean = 1/λ, Variance = 1/λ². Memoryless property: P(X>s+t|X>s) = P(X>t). Applications: service time, component lifetime, time between failures. Rate λ is the reciprocal of the mean: if average time = 5 min, λ = 0.2."},
{q:"What is the Binomial distribution?",a:"Binomial models the count of successes in n independent Bernoulli trials, each with success probability p. PMF: P(X=k) = C(n,k) pᵏ (1-p)^(n-k). Mean = np, Variance = np(1-p). Examples: number of heads in 10 coin flips, defects in a batch. When n is large and p is small, approximated by Poisson (λ=np). When n is large, approximated by Normal."},
{q:"What is the Bernoulli distribution?",a:"Bernoulli is the simplest distribution: single trial with two outcomes — success (1) with probability p, failure (0) with probability (1-p). PMF: P(X=1)=p, P(X=0)=1-p. Mean = p, Variance = p(1-p). It's the building block of Binomial (sum of n Bernoulli), logistic regression (models each prediction as Bernoulli). Examples: coin flip, click/no-click, disease/no-disease."},
{q:"What is the Poisson distribution?",a:"Poisson models the count of events occurring in a fixed interval of time or space when events occur independently at a constant average rate λ. PMF: P(X=k) = e^(-λ)λᵏ/k!. Mean = Variance = λ. Examples: emails per hour, server requests per minute, accidents per day. When λ is large, Poisson approximates Normal. Use Poisson over Binomial when n is large, p is small, and np = λ is moderate."},
{q:"When to use Poisson over Binomial?",a:"Use Poisson when: n is very large (often unknown), p is very small, events are rare, and np=λ is finite/moderate. Examples: website errors per hour (n=millions of requests, p=tiny). Use Binomial when: n is known and fixed, each trial has two outcomes, probability p is not negligible. Rule: if n>20 and p<0.05 (or np<5), Poisson is a good approximation."},
{q:"What is variance and standard deviation?",a:"<b>Variance</b>: σ² = E[(X-μ)²] = (1/n)Σ(xᵢ-μ)². Average squared deviation from mean. Units are squared — hard to interpret. <b>Standard deviation</b>: σ = √Variance. Same units as data. Measures spread/dispersion. 68% of Normal data falls within 1σ. Use <b>sample variance</b> (divide by n-1, Bessel's correction) for unbiased estimate from a sample."},
{q:"Explain the difference between mean, median, and mode.",a:"<b>Mean</b>: arithmetic average. Sensitive to outliers. Best for symmetric distributions.<br><b>Median</b>: middle value when sorted. Robust to outliers. Best for skewed distributions (income, house prices).<br><b>Mode</b>: most frequent value. Only one meaningful for categorical data.<br><br>Symmetric distribution: mean ≈ median. Right-skewed: mean > median. Left-skewed: mean < median."},
{q:"What is the difference between correlation and covariance?",a:"<b>Covariance</b>: Cov(X,Y) = E[(X-μX)(Y-μY)]. Measures how X and Y vary together. Units = product of X and Y units — hard to interpret magnitude.<br><br><b>Correlation</b>: ρ = Cov(X,Y)/(σX·σY). Normalized covariance. Dimensionless, always in [-1,1]. Correlation of +1: perfect positive linear relationship. -1: perfect negative. 0: no linear relationship. Correlation ≠ causation."},
{q:"What are Type I and Type II errors?",a:"<b>Type I error (α)</b>: False Positive — reject H₀ when H₀ is actually true. 'Crying wolf.' Probability = significance level (α, typically 0.05).<br><br><b>Type II error (β)</b>: False Negative — fail to reject H₀ when H₁ is true. 'Missing the wolf.' Power = 1-β. Trade-off: reducing α increases β. Choose α based on cost of each error type. In medicine: Type II often more dangerous (missing disease)."},
{q:"What is a p-value?",a:"The p-value is the probability of observing data as extreme or more extreme than what was observed, assuming H₀ is true. Small p-value (< α=0.05) → data is unlikely under H₀ → reject H₀. NOT the probability that H₀ is true. Limitations: p-value depends on sample size (large n → trivial effects become significant), doesn't measure effect size, susceptible to p-hacking. Use alongside effect sizes and confidence intervals."},
{q:"What is hypothesis testing?",a:"Hypothesis testing is a statistical framework to make decisions about populations from samples. Steps: (1) State H₀ (null) and H₁ (alternative). (2) Choose significance level α. (3) Compute test statistic. (4) Calculate p-value. (5) Reject H₀ if p < α. Common tests: t-test (compare means), chi-squared (categorical association), ANOVA (multiple group means), Mann-Whitney U (non-parametric). In ML: compare model performance."},
{q:"What statistical tests to compare two models?",a:"<b>Paired t-test</b>: compare mean accuracy across k-fold splits (paired, as same data splits used). <b>McNemar's test</b>: for classification — compare error patterns. <b>Wilcoxon signed-rank test</b>: non-parametric alternative to paired t-test. <b>5×2 CV test</b>: 5 repetitions of 2-fold CV with F-test — accounts for variance. Always use same data splits for both models to avoid confounding."},
{q:"What is a confidence interval?",a:"A confidence interval gives a range of plausible values for a population parameter. A 95% CI means: if we repeated the experiment 100 times, 95% of the CIs would contain the true parameter. Interpretation: we are 95% confident the true value lies in [lower, upper]. Width depends on sample size (larger n → narrower CI) and confidence level (higher % → wider CI). More informative than p-value alone."},
{q:"What are z-score and t-score?",a:"<b>Z-score</b>: z = (x-μ)/σ. Used when population σ is known or n>30 (CLT). Standard Normal distribution. Used in: standardization, hypothesis testing, outlier detection (|z|>3).<br><br><b>T-score</b>: t = (x̄-μ)/(s/√n). Used when σ is unknown (use sample std s) and n is small. t-distribution has heavier tails (more uncertainty). As n→∞, t-distribution approaches Normal."},
{q:"Explain Bayes' Theorem.",a:"P(A|B) = P(B|A)·P(A) / P(B). Update prior belief P(A) with evidence B to get posterior P(A|B). <b>Prior</b>: belief before evidence. <b>Likelihood</b>: P(B|A), how likely evidence under hypothesis. <b>Posterior</b>: updated belief after evidence. Application in ML: Naive Bayes (P(class|features)), Bayesian optimization, probabilistic graphical models, Bayesian neural networks."},
{q:"What's the difference between MLE and MAP?",a:"<b>MLE (Maximum Likelihood Estimation)</b>: find parameters that maximize P(data|θ). No prior. Can overfit with small data.<br><br><b>MAP (Maximum A Posteriori)</b>: find parameters maximizing P(θ|data) ∝ P(data|θ)·P(θ). Incorporates prior P(θ). MAP with Gaussian prior = L2 regularized MLE (Ridge). MAP with Laplace prior = L1 regularized MLE (Lasso). MAP reduces to MLE when prior is uniform."},
{q:"What is the Central Limit Theorem (CLT)?",a:"CLT states that the sum (or mean) of a large number of independent, identically distributed random variables approaches a Normal distribution, regardless of the original distribution. Formally: if X₁...Xₙ are i.i.d. with mean μ and variance σ², then √n(X̄-μ)/σ → N(0,1) as n→∞. Typically n>30 is sufficient. Foundation of: confidence intervals, hypothesis tests, bootstrap, law of large numbers."},
{q:"What are sampling techniques?",a:"<b>Simple random sampling</b>: each sample equally likely. <b>Stratified</b>: divide into strata, sample proportionally from each (preserves subgroup representation). <b>Cluster</b>: sample entire clusters. <b>Systematic</b>: every kth element. <b>Convenience</b>: easily accessible (biased). <b>Bootstrap</b>: sample with replacement for estimating sampling distributions. For ML: stratified split for classification (preserve class ratios)."},
{q:"What is the bootstrap method?",a:"Bootstrap estimates the sampling distribution of a statistic by resampling with replacement from the observed data. Steps: (1) Draw B bootstrap samples of size n (with replacement) from original data. (2) Compute statistic θ̂ᵦ for each. (3) Use distribution of θ̂ᵦ to estimate std error, confidence intervals, or bias. Used when: analytical formulas are unavailable, sample is small. Bootstrap confidence interval: percentile method [θ̂₂.₅%, θ̂₉₇.₅%]."},

{q:"Write a Python function to compute MSE.",a:'<pre>def mse(y_true, y_pred):\n    n = len(y_true)\n    return sum((yt - yp)**2 for yt, yp in zip(y_true, y_pred)) / n\n\n# With NumPy:\nimport numpy as np\ndef mse(y_true, y_pred):\n    return np.mean((np.array(y_true) - np.array(y_pred))**2)</pre>'},
{q:"Write a Python function to compute MAE.",a:'<pre>def mae(y_true, y_pred):\n    return sum(abs(yt - yp) for yt, yp in zip(y_true, y_pred)) / len(y_true)\n\n# With NumPy:\ndef mae(y_true, y_pred):\n    return np.mean(np.abs(np.array(y_true) - np.array(y_pred)))</pre>'},
{q:"Implement Linear Regression from scratch.",a:'<pre>import numpy as np\n\nclass LinearRegression:\n    def __init__(self, lr=0.01, n_iter=1000):\n        self.lr = lr\n        self.n_iter = n_iter\n    \n    def fit(self, X, y):\n        n, p = X.shape\n        self.w = np.zeros(p)\n        self.b = 0\n        for _ in range(self.n_iter):\n            y_pred = X @ self.w + self.b\n            dw = (2/n) * X.T @ (y_pred - y)\n            db = (2/n) * np.sum(y_pred - y)\n            self.w -= self.lr * dw\n            self.b -= self.lr * db\n    \n    def predict(self, X):\n        return X @ self.w + self.b</pre>'},
{q:"Implement Logistic Regression from scratch.",a:'<pre>import numpy as np\n\nclass LogisticRegression:\n    def __init__(self, lr=0.01, n_iter=1000):\n        self.lr = lr; self.n_iter = n_iter\n    \n    def sigmoid(self, z):\n        return 1 / (1 + np.exp(-z))\n    \n    def fit(self, X, y):\n        n, p = X.shape\n        self.w = np.zeros(p); self.b = 0\n        for _ in range(self.n_iter):\n            z = X @ self.w + self.b\n            y_pred = self.sigmoid(z)\n            dw = (1/n) * X.T @ (y_pred - y)\n            db = (1/n) * np.sum(y_pred - y)\n            self.w -= self.lr * dw\n            self.b -= self.lr * db\n    \n    def predict(self, X, threshold=0.5):\n        return (self.sigmoid(X @ self.w + self.b) >= threshold).astype(int)</pre>'},
{q:"Implement K-Nearest Neighbors (KNN) from scratch.",a:'<pre>import numpy as np\nfrom collections import Counter\n\nclass KNN:\n    def __init__(self, k=3):\n        self.k = k\n    \n    def fit(self, X, y):\n        self.X_train = X\n        self.y_train = y\n    \n    def predict(self, X):\n        return [self._predict_one(x) for x in X]\n    \n    def _predict_one(self, x):\n        dists = np.sqrt(np.sum((self.X_train - x)**2, axis=1))\n        k_idx = np.argsort(dists)[:self.k]\n        k_labels = self.y_train[k_idx]\n        return Counter(k_labels).most_common(1)[0][0]</pre>'},
{q:"Implement Activation Functions.",a:'<pre>import numpy as np\n\ndef sigmoid(x):   return 1 / (1 + np.exp(-x))\ndef tanh(x):      return np.tanh(x)\ndef relu(x):      return np.maximum(0, x)\ndef leaky_relu(x, alpha=0.01):\n    return np.where(x >= 0, x, alpha * x)\ndef softmax(x):\n    exp_x = np.exp(x - np.max(x))  # stability trick\n    return exp_x / exp_x.sum(axis=-1, keepdims=True)</pre>'},
{q:"Implement K-Means clustering.",a:'<pre>import numpy as np\n\ndef kmeans(X, k, max_iter=100):\n    # Random init\n    centroids = X[np.random.choice(len(X), k, replace=False)]\n    for _ in range(max_iter):\n        # Assign\n        dists = np.sqrt(((X - centroids[:, None])**2).sum(axis=2))\n        labels = np.argmin(dists, axis=0)\n        # Update\n        new_centroids = np.array([X[labels==i].mean(0) for i in range(k)])\n        if np.allclose(centroids, new_centroids):\n            break\n        centroids = new_centroids\n    return labels, centroids</pre>'},
{q:"Write code to perform k-fold cross-validation.",a:'<pre>import numpy as np\n\ndef kfold_cv(model, X, y, k=5):\n    n = len(X)\n    idx = np.random.permutation(n)\n    fold_size = n // k\n    scores = []\n    for i in range(k):\n        val_idx = idx[i*fold_size:(i+1)*fold_size]\n        train_idx = np.concatenate([idx[:i*fold_size],\n                                    idx[(i+1)*fold_size:]])\n        model.fit(X[train_idx], y[train_idx])\n        preds = model.predict(X[val_idx])\n        acc = np.mean(preds == y[val_idx])\n        scores.append(acc)\n    return np.mean(scores), np.std(scores)</pre>'},
{q:"How would you use Pandas to load and clean data?",a:'<pre>import pandas as pd\nimport numpy as np\n\n# Load\ndf = pd.read_csv("data.csv")\n\n# Inspect\nprint(df.shape, df.dtypes)\nprint(df.isnull().sum())  # missing values\nprint(df.describe())      # stats\n\n# Clean\ndf.drop_duplicates(inplace=True)\ndf["age"].fillna(df["age"].median(), inplace=True)\ndf["city"].fillna("Unknown", inplace=True)\n\n# Feature engineering\ndf["age_group"] = pd.cut(df["age"], bins=[0,18,35,60,100],\n                         labels=["young","adult","mid","senior"])\n\n# Encode\ndf = pd.get_dummies(df, columns=["city"], drop_first=True)</pre>'},
{q:"Write code to calculate precision and recall.",a:'<pre>def precision_recall(y_true, y_pred):\n    tp = sum(yt==1 and yp==1 for yt,yp in zip(y_true,y_pred))\n    fp = sum(yt==0 and yp==1 for yt,yp in zip(y_true,y_pred))\n    fn = sum(yt==1 and yp==0 for yt,yp in zip(y_true,y_pred))\n    precision = tp / (tp + fp) if (tp + fp) > 0 else 0\n    recall    = tp / (tp + fn) if (tp + fn) > 0 else 0\n    f1 = 2*precision*recall/(precision+recall) if (precision+recall)>0 else 0\n    return precision, recall, f1\n\n# Test\ny_true = [1,0,1,1,0,1,0]\ny_pred = [1,0,1,0,0,1,1]\nprint(precision_recall(y_true, y_pred))</pre>'},

{q:"What are Eigenvalues and Eigenvectors?",a:"For a square matrix A, an eigenvector v and eigenvalue λ satisfy: Av = λv. The eigenvector v is a direction unchanged by the transformation A — only scaled by λ. Finding: solve det(A - λI) = 0 for eigenvalues, then (A - λI)v = 0 for eigenvectors.<br><br>Applications in ML: PCA (eigenvectors of covariance matrix = principal components, eigenvalues = variance explained), spectral clustering, PageRank, understanding model geometry and convergence."},

transformer:[
{q:"What is the core principle of the Transformer? How is it different from RNNs and CNNs?",a:"The Transformer's key innovation is replacing recurrence and convolution with <b>self-attention</b>. RNNs process tokens sequentially (each step depends on the previous) — slow, no parallelism, struggles with long-range dependencies. CNNs use local receptive fields — can't directly model distant relationships without many layers.<br><br>Transformer: processes ALL tokens simultaneously via attention — fully parallelizable, O(1) path between any two positions, scales massively with data and compute. The tradeoff: O(n²) memory in attention vs O(n) for RNNs.<br><br><i>Source: purepisces/Wenqing-Machine_Learning_Blog (188★)</i>"},
{q:"Explain the full Encoder architecture in a Transformer, layer by layer.",a:"The Encoder stack processes the input sequence into rich contextual representations.<br><br><b>Input layer</b>: Token embedding (vocab → dmodel) + Positional encoding (adds position information).<br><br><b>Each Encoder block (repeated N times, e.g., N=6 in original paper)</b>:<br>1. <b>Multi-Head Self-Attention</b>: each token attends to all other tokens in the same sequence. Q, K, V all come from the same input.<br>2. <b>Add & LayerNorm</b>: residual connection + layer normalization: x = LayerNorm(x + Attention(x))<br>3. <b>Feed-Forward Network</b>: two linear layers with ReLU/GELU. Applied position-wise (same FFN at each position independently).<br>4. <b>Add & LayerNorm</b>: another residual + norm: x = LayerNorm(x + FFN(x))<br><br>Output: a sequence of contextual vectors, same length as input. Used by: BERT (encoder-only), also encoder side of T5, BART.<br><br><i>Source: purepisces/Wenqing-Machine_Learning_Blog (188★)</i>"},
{q:"Explain the full Decoder architecture in a Transformer, layer by layer.",a:"The Decoder generates output tokens one at a time (autoregressive at inference), attending to both its own previous outputs and the encoder's output.<br><br><b>Each Decoder block (repeated N times)</b>:<br>1. <b>Masked Multi-Head Self-Attention</b>: tokens attend only to previous positions (causal mask prevents looking at future tokens). Ensures autoregressive property during training.<br>2. <b>Add & LayerNorm</b><br>3. <b>Multi-Head Cross-Attention</b>: Q comes from decoder's previous sublayer; K and V come from the ENCODER's output. This is how the decoder 'reads' the encoded input.<br>4. <b>Add & LayerNorm</b><br>5. <b>Feed-Forward Network</b><br>6. <b>Add & LayerNorm</b><br><br>Output: projected through linear + softmax to produce vocabulary probability distribution for next token.<br><br>Used in: original Transformer (machine translation), T5, BART (encoder-decoder). GPT uses decoder-only (no cross-attention)."},
{q:"What is Cross-Attention and how does it differ from Self-Attention?",a:"<b>Self-attention</b>: Q, K, and V all come from the SAME sequence. Each token attends to all other tokens in its own sequence. Used in: encoder (attends to input), decoder masked self-attention (attends to previous output tokens).<br><br><b>Cross-attention</b>: Q comes from the DECODER (current position in output), but K and V come from the ENCODER output (the encoded input representation). This is the 'bridge' between encoder and decoder — it lets the decoder decide which encoder positions to focus on when generating each output token.<br><br>Example: translating 'The cat sat' → 'Le chat': when generating 'chat', cross-attention focuses Q on K/V from 'cat' position in the encoder. This replaced the fixed context vector bottleneck of old seq2seq models."},
{q:"What is the difference between Encoder-only, Decoder-only, and Encoder-Decoder architectures?",a:"<b>Encoder-only (e.g., BERT, RoBERTa)</b>: processes full input bidirectionally — each token sees all others. No causal mask. Best for: classification, NER, sentence embeddings, QA (extractive). Cannot generate sequences autoregressively.<br><br><b>Decoder-only (e.g., GPT, LLaMA, Claude)</b>: processes tokens left-to-right with causal mask. No cross-attention (no separate encoder). Best for: text generation, language modeling, instruction following, coding. All modern LLMs use this.<br><br><b>Encoder-Decoder (e.g., T5, BART, original Transformer)</b>: encoder processes full input (bidirectional), decoder generates output token-by-token with cross-attention to encoder. Best for: machine translation, summarization, seq2seq tasks with structured input→output mapping.<br><br><i>Source: amitshekhariitbhu/ai-engineering-interview-questions</i>"},
{q:"Why does the Transformer use positional encoding? What types exist?",a:"Transformers have no inherent sense of order — attention treats all positions equally (permutation-equivariant). Without positional encoding, 'dog bites man' = 'man bites dog'.<br><br><b>Sinusoidal (original paper)</b>: PE(pos,2i) = sin(pos/10000^(2i/d)), PE(pos,2i+1) = cos(pos/10000^(2i/d)). Fixed, no learned parameters, generalizes to longer sequences than seen in training.<br><br><b>Learned absolute PE</b>: trainable embedding per position. Works well but doesn't extrapolate.<br><br><b>Relative PE (RoPE)</b>: rotates Q,K vectors by position-dependent angle. Attention score depends on relative distance. Extrapolates better. Used in LLaMA, Mistral, GPT-NeoX.<br><br><b>ALiBi</b>: adds linear bias to attention scores based on distance. No learned position params. Good length extrapolation.<br><br><i>Source: purepisces/Wenqing-Machine_Learning_Blog (188★)</i>"},
{q:"Why does the Transformer use LayerNorm instead of BatchNorm?",a:"<b>BatchNorm</b> normalizes across the batch dimension — computes mean/variance over a batch of samples for each feature. Problem for NLP: sequences have variable lengths; batch statistics depend on other samples; doesn't work well with small batches or single-sample inference.<br><br><b>LayerNorm</b> normalizes across the feature dimension for each individual sample independently. Formula: LN(x) = (x - μ) / σ × γ + β, where μ,σ computed over all features of ONE sample. Advantages: independent of batch size, works with variable-length sequences, more stable for sequential models, same behavior at train and inference time.<br><br>Pre-norm (LayerNorm before attention) vs Post-norm (after) — Pre-norm generally more stable for very deep models.<br><br><i>Source: purepisces/Wenqing-Machine_Learning_Blog (188★)</i>"},
{q:"Why does the Transformer use Multi-Head Attention? What does each head learn?",a:"Single-head attention learns one type of relationship between tokens. Multi-head attention runs H attention heads in parallel with DIFFERENT learned Q,K,V projection matrices (Wᵢq, Wᵢk, Wᵢv for each head i).<br><br>Different heads specialize in different relationship types: some heads attend to syntactic relationships (subject-verb agreement), some attend to semantic similarity, some focus on positional/local patterns, some on coreference (pronouns → nouns).<br><br>Outputs from all heads are concatenated and projected: MHA(Q,K,V) = Concat(head₁,...,headₕ)Wᴼ<br><br>This gives the model multiple 'perspectives' on the same input — richer representation than any single attention pattern. Typical: dmodel=512, H=8, each head dim dₖ=64 (512/8).<br><br><i>Source: purepisces/Wenqing-Machine_Learning_Blog (188★)</i>"},
{q:"What is Masked Self-Attention in the Decoder? Why is it needed?",a:"During training, the decoder receives the ENTIRE target sequence at once (teacher forcing — efficient parallel training). But we must prevent token t from seeing future tokens t+1, t+2, ... (that would be 'cheating' — the model should predict token t without knowing what comes after).<br><br>Masked attention adds -∞ to attention scores for future positions before softmax: mask[i,j] = -∞ if j > i, else 0. After softmax, these become ≈ 0 (no attention to future). Only past and current positions are attended to.<br><br>At inference (generation): there are no future tokens yet — the model generates one token at a time left-to-right, so no masking needed (past tokens are already determined)."},
{q:"Explain Residual (Skip) Connections in Transformers. Why are they critical?",a:"A residual connection adds the input of a sublayer directly to its output: x = x + Sublayer(LayerNorm(x)).<br><br>Why critical:<br>1. <b>Gradient flow</b>: gradients can propagate directly backward through the skip path without passing through the sublayer. Prevents vanishing gradients in deep networks (6-96+ layers).<br>2. <b>Identity shortcut</b>: if the sublayer learns to output zero, the layer becomes an identity — easier to optimize. Layers learn residuals (corrections) rather than full transformations.<br>3. <b>Depth</b>: enables training of very deep Transformers (GPT-3: 96 layers, LLaMA: 32-80 layers).<br>4. <b>Feature reuse</b>: information from earlier layers flows to later layers directly.<br><br>Without residual connections: Transformers deeper than ~12 layers are very hard to train.<br><br><i>Source: purepisces/Wenqing-Machine_Learning_Blog (188★)</i>"},
{q:"What are the Q, K, V vectors? What are their dimensions?",a:"In self-attention, for each input token embedding x (dimension dmodel):<br><b>Query Q</b> = x · Wq — 'what am I looking for?'<br><b>Key K</b> = x · Wk — 'what do I contain?'<br><b>Value V</b> = x · Wv — 'what information do I carry?'<br><br>Each token has its OWN Q, K, V vectors. So for a sequence of n tokens: Q, K, V matrices are each [n × dₖ].<br><br>Dimensions: Wq, Wk, Wv ∈ R^(dmodel × dₖ). In original paper: dmodel=512, dₖ=64 (per head), H=8 heads → total = 512.<br><br>Attention(Q,K,V) = softmax(QKᵀ / √dₖ) · V → output shape [n × dₖ].<br><br>Every token produces one Q, one K, one V — YES, each token independently gets its own set.<br><br><i>Source: purepisces/Wenqing-Machine_Learning_Blog (188★)</i>"},
{q:"Why does the Transformer use separate weight matrices for Q, K, and V?",a:"Each plays a different role in attention — using the same matrix for all three would be too constrained.<br><br><b>Q (Query)</b>: represents 'what this token is looking for'. Needs to match keys of relevant tokens.<br><b>K (Key)</b>: represents 'what this token contains'. Should match queries that are looking for its information.<br><b>V (Value)</b>: represents 'what information to pass when attended to'. Decoupled from matching — a token might be important to attend to (high Q·K score) but provide different information (V) than its embedding directly encodes.<br><br>Separate projections give the model flexibility to learn different transformations for each role. If Q=K=V projections, the model is forced to simultaneously optimize all three constraints with one matrix — much harder.<br><br><i>Source: purepisces/Wenqing-Machine_Learning_Blog (188★)</i>"},
{q:"What are the aspects of Transformer parallelization?",a:"Transformers are highly parallelizable, unlike RNNs:<br><br>1. <b>Self-attention</b>: all Q·K dot products computed simultaneously across all token pairs — no sequential dependency. GPU-friendly matrix multiplications.<br>2. <b>Positional encoding</b>: added in one step, no sequential dependency on order.<br>3. <b>Feed-forward</b>: applied independently per position — all positions computed in parallel.<br>4. <b>Layer stacking</b>: each layer can be pipelined. Pipeline parallelism across GPUs for very large models.<br>5. <b>Training efficiency</b>: teacher forcing — the decoder receives the full target sequence at once, all positions trained simultaneously (vs RNN: must wait for previous step).<br><br>Limitation: autoregressive INFERENCE is sequential (must generate one token at a time). Speculative decoding helps here.<br><br><i>Source: purepisces/Wenqing-Machine_Learning_Blog (188★)</i>"},
{q:"How does Scaled Dot-Product Attention work step by step?",a:"Step-by-step:<br>1. <b>Project</b>: compute Q = X·Wq, K = X·Wk, V = X·Wv<br>2. <b>Dot product</b>: compute attention scores S = Q·Kᵀ → shape [n×n], where Sᵢⱼ = how much token i should attend to token j<br>3. <b>Scale</b>: divide by √dₖ → prevents large magnitudes pushing softmax into saturation<br>4. <b>Mask</b> (decoder only): add -∞ to future positions<br>5. <b>Softmax</b>: convert scores to probabilities → each row sums to 1<br>6. <b>Weighted sum</b>: output = softmax(S) · V → each position gets a weighted combination of all Value vectors<br><br>Formula: Attention(Q,K,V) = softmax(QKᵀ/√dₖ)V<br>Complexity: O(n²·d) time, O(n²) memory — quadratic in sequence length.<br><br><i>Source: KalyanKS-NLP/LLM-Interview-Questions-and-Answers-Hub</i>"},
{q:"Explain how Cross-Attention operates with a concrete example.",a:"Cross-attention bridges encoder and decoder in seq2seq tasks.<br><br><b>Mechanism</b>: Q comes from decoder hidden state, K and V come from encoder output.<br>- Q = decoder_state · Wq (shape: [target_len × dₖ])<br>- K = encoder_output · Wk (shape: [source_len × dₖ])<br>- V = encoder_output · Wv (shape: [source_len × dₖ])<br><br><b>Concrete example (translation)</b>: Translating 'The black cat' → 'Le chat noir'.<br>When decoder generates 'chat': Q is the decoder's current state for position 2. It computes attention scores against K of all encoder positions. High score for 'cat' (position 3 in source) → V from 'cat' position weighted heavily → decoder uses 'cat' information to generate 'chat'.<br><br>When generating 'noir': attention shifts to 'black' in the source. Different output positions dynamically attend to different input positions — this is the power of attention vs fixed context vector."},
{q:"What are encoder-only models used for vs decoder-only models?",a:"<b>Encoder-only (BERT, RoBERTa, DeBERTa)</b>:<br>- Bidirectional: each token sees ALL tokens (full context both directions)<br>- Best for: text classification, sentiment analysis, NER, extractive QA, sentence similarity, embeddings<br>- Cannot generate text (no autoregressive mechanism)<br>- Training objective: Masked Language Modeling (MLM)<br><br><b>Decoder-only (GPT, LLaMA, Claude, Gemini, Mistral)</b>:<br>- Unidirectional: each token sees only past tokens (causal mask)<br>- Best for: text generation, summarization (generative), instruction following, coding, chat<br>- Training objective: next-token prediction (Causal LM)<br>- All modern LLMs use decoder-only: simpler, scales better, generalizes to many tasks via prompting<br><br>Key insight: decoder-only models can be adapted for 'understanding' tasks via prompting, making the encoder-only/decoder-only distinction less sharp at scale.<br><br><i>Source: youssefHosni/Data-Science-Interview-Questions-Answers</i>"},
{q:"What is autoregressive vs masked language modeling?",a:"<b>Autoregressive (Causal LM — GPT, decoder-only)</b>: predict the NEXT token given all previous tokens. P(xₜ|x₁,...,xₜ₋₁). Training: teacher forcing — feed the full sequence, mask future tokens, predict at every position simultaneously. Inference: generate one token at a time left-to-right (sequential).<br><br><b>Masked LM (BERT-style)</b>: randomly mask 15% of tokens, predict the MASKED tokens using BOTH left and right context. Not autoregressive — cannot generate text directly. Training is faster (predict multiple positions per sample) but the model learns bidirectional representations.<br><br>Key difference: AutoRegressive → good for generation. Masked LM → good for understanding and embeddings. GPT vs BERT is the clearest example of this split.<br><br><i>Source: amitshekhariitbhu/ai-engineering-interview-questions</i>"},
{q:"How does BERT use the Encoder? How does it differ from GPT?",a:"<b>BERT</b>: uses ENCODER ONLY (no decoder, no causal mask). Processes the entire input sequence bidirectionally — every token attends to every other token. Pretrained with: (1) MLM: predict 15% masked tokens using full context. (2) NSP: predict if sentence B follows sentence A.<br><br><b>GPT</b>: uses DECODER ONLY (no encoder). Processes left-to-right with causal mask. Pretrained with: next-token prediction.<br><br>Key difference:<br>- BERT: bidirectional context → richer token representations → better for understanding tasks<br>- GPT: unidirectional → can generate text → better for generation<br>- BERT can't generate; GPT can't natively do bidirectional encoding<br>- Modern practice: decoder-only (GPT style) at large scale outperforms BERT on nearly all tasks via prompting<br><br><i>Source: youssefHosni/Data-Science-Interview-Questions-Answers (Deep Learning Q&A)</i>"},
{q:"What is the Feed-Forward Network (FFN) in a Transformer block and what does it do?",a:"Each Transformer block has a position-wise Feed-Forward Network applied AFTER attention:<br>FFN(x) = max(0, xW₁ + b₁)W₂ + b₂<br>(or with GELU activation in modern models)<br><br><b>Dimensions</b>: W₁ ∈ R^(dmodel × dff), W₂ ∈ R^(dff × dmodel). Typically dff = 4 × dmodel (e.g., 2048 for dmodel=512). This 4× expansion is the 'FFN bottleneck'.<br><br><b>What it does</b>:<br>- Attention mixes information ACROSS positions (which tokens to combine)<br>- FFN processes each position INDEPENDENTLY (what to do with the mixed information)<br>- FFN is the main site of factual knowledge storage (probing studies: specific facts can be localized to FFN neurons)<br>- Accounts for ~66% of model parameters in typical Transformers<br><br>Applied identically to each position: this is the 'position-wise' part — same weights, different input at each position."},
{q:"What is T5 and how does it use the Encoder-Decoder architecture?",a:"T5 (Text-to-Text Transfer Transformer) reformulates EVERY NLP task as a text-to-text problem. Input: task-prefixed text. Output: text answer. Example: 'translate English to French: The cat' → 'Le chat'. Classification: 'sentiment: I loved this movie' → 'positive'.<br><br><b>Architecture</b>: Full encoder-decoder. Encoder processes input bidirectionally. Decoder generates output token-by-token via cross-attention to encoder. Relative position biases (not sinusoidal PE). Pre-norm (LayerNorm before sublayer).<br><br><b>Advantage</b>: uniform framework for all tasks. Train once, adapt many tasks. <b>Variants</b>: T5-Small (60M) to T5-XXL (11B). Flan-T5 adds instruction tuning.<br><br>Contrast with GPT: GPT puts everything in one sequence (input + output concatenated); T5 separates input (encoder) and output (decoder) — better for long input-output tasks like translation."},
{q:"What happens at each Transformer block in terms of what is learned?",a:"Research (probing studies, mechanistic interpretability) reveals a loose hierarchy:<br><br><b>Early layers (1-3)</b>: learn local/syntactic patterns — part-of-speech, basic syntactic structure, local token relationships. Attention heads focus on nearby tokens.<br><br><b>Middle layers (4-8)</b>: learn semantic relationships, coreference resolution (which pronouns refer to which nouns), named entity information, medium-range dependencies.<br><br><b>Late layers (9+)</b>: learn task-specific, abstract representations — sentence-level semantics, complex reasoning, factual associations (FFN neurons store specific facts).<br><br><b>Attention heads</b>: some specialize in positional patterns, some in syntactic dependencies, some in semantic similarity. Heads are prunable — many can be removed without much performance loss (redundancy).<br><br><b>FFN neurons</b>: act like key-value memories storing factual knowledge. Specific neurons activate for specific concepts (e.g., a 'France' concept neuron)."},
{q:"Your Transformer runs out of memory on long documents due to quadratic attention. How do you scale it?",a:"Standard self-attention is O(n²) memory — 4K tokens = 16M cells in attention matrix. Solutions:<br><br><b>Algorithmic</b>: <b>Flash Attention</b> — reorders computation using tiling to avoid materializing full attention matrix. Same math, O(n) memory, 2-4x faster. Most widely used fix.<br><br><b>Sparse attention</b>: Longformer (sliding window + global tokens), BigBird (random + local + global). Reduces to O(n).<br><br><b>Linear attention</b>: approximates softmax attention with kernel functions. O(n) but lower quality.<br><br><b>State Space Models (SSMs/Mamba)</b>: replace attention entirely with recurrent-style computation. O(n) time and memory. Competitive quality on some tasks.<br><br><b>KV cache compression</b>: H2O, StreamingLLM — drop less important KV cache entries.<br><br><b>Chunking</b>: process document in overlapping chunks.<br><br><i>Source: amitshekhariitbhu/ai-engineering-interview-questions</i>"},
],
beh:[
{q:"Describe a time you improved a model's performance.",a:"Structure using STAR: Situation (what was the baseline, what problem?), Task (your role), Action (what you did — feature engineering, better model, hyperparameter tuning, data collection, fixing data leakage), Result (quantify improvement — 'F1 improved from 0.72 to 0.86'). Tip: even if from a project or course, use it. Mention what you learned: error analysis led you to discover label noise or missing feature."},
{q:"How would you approach a project with limited labeled data?",a:"(1) Start with strong baselines: rule-based, pretrained models, zero-shot. (2) Transfer learning: fine-tune a pretrained model on small labeled data. (3) Data augmentation to expand training set. (4) Active learning: label the most informative examples first. (5) Semi-supervised learning: use unlabeled data (pseudo-labeling, self-training). (6) Few-shot learning techniques. (7) Synthetically generate training data. (8) Simplify task: reduce classes, binary instead of multi-class."},
{q:"What would you do if a model performs well in testing but poorly in production?",a:"This indicates train-serving skew. Investigation steps: (1) Check feature distributions — are production inputs different from training data? (2) Check for data leakage in training (label leakage → inflated test metrics). (3) Compare preprocessing pipelines — any difference between training and inference code? (4) Check label quality. (5) Check if production data is from a different distribution (temporal drift, demographic shift). Fix: shadow deployment testing before full rollout."},
{q:"How do you stay updated with ML advancements?",a:"(1) Papers: arXiv (cs.LG, cs.CL, cs.CV), Papers with Code. (2) Blogs: Distill.pub, Google AI Blog, Hugging Face blog, Anthropic research. (3) Twitter/X: follow researchers. (4) Courses: fast.ai, DeepLearning.ai. (5) Kaggle: hands-on with real competitions. (6) GitHub: star important repos (e.g., transformers, pytorch). (7) YouTube: Yannic Kilcher, Andrej Karpathy. (8) MLOps Community. (9) Implement key papers from scratch."},
{q:"Tell about a challenging ML project. (STAR framework)",a:"Structure: <b>S</b>ituation — describe the problem, dataset, constraints. <b>T</b>ask — your specific responsibility. <b>A</b>ction — detail your technical approach: data exploration, model selection rationale, challenges overcome (class imbalance, overfitting, deployment issues). <b>R</b>esult — quantified outcome (accuracy improvement, latency reduction, business impact). Key: show problem-solving ability, technical depth, communication, and learning from failure."},
{q:"Where do you see ML/AI heading in the next 5 years?",a:"(1) Multimodal models (text + image + video + audio) become standard. (2) Agents: LLMs using tools, planning, and executing multi-step tasks. (3) On-device/edge AI: efficient models on smartphones. (4) Better alignment and safety: as models become more capable. (5) Scientific discovery: AI accelerating biology, materials science, drug discovery. (6) Reasoning improvements: moving beyond pattern matching. (7) Regulations and AI governance maturing. (8) Democratization: smaller teams building powerful AI."},
{q:"Why are you interested in this role/company (ReliSource)?",a:"Key points: (1) Global exposure from Dhaka — work with US/European clients while based locally — rare opportunity early in career. (2) Real-world ML — not toy projects; production ML pipelines for healthcare, logistics, insurance. (3) Azure ML + MLOps stack — industry-standard skills. (4) Strong engineering culture — low attrition (6.72%), long average tenure signals a stable learning environment. (5) Entry point to international software development career."},
{q:"Describe when your ML model failed. What did you do?",a:"Use STAR. Example answer: 'My sentiment model worked great in testing (89% accuracy) but poorly on production social media data. I investigated: training data was from formal product reviews, but production data was informal tweets with slang, emojis, abbreviations. I (1) collected and labeled 500 production examples, (2) added text normalization, (3) fine-tuned on mixed data. Production accuracy improved to 82%. Lesson: always validate on representative data, not just held-out training data.'"},
{q:"How would you handle disagreements about model choices?",a:"(1) Stay objective — focus on data and evidence, not opinions. (2) Propose a fair comparison: define evaluation metric, train both approaches, compare on same held-out set. (3) Understand their reasoning — there may be valid constraints (latency, interpretability) you're not aware of. (4) Document tradeoffs clearly. (5) Be open to being wrong — scientific mindset. (6) Escalate to team lead only if truly stuck after data-driven comparison. Collaboration > being right."},
]
};

let seen = JSON.parse(localStorage.getItem('ml_seen') || '{}');
let currentCat = 'ml';
let expandedAll = false;

function totalCount(){return Object.values(QA).reduce((s,v)=>s+v.length,0)}
function seenCount(){return Object.keys(seen).length}

function updateStats(){
  document.getElementById('total-count').textContent = totalCount();
  document.getElementById('seen-count').textContent = seenCount();
  const pct = Math.round(seenCount()/totalCount()*100);
  document.getElementById('progress').style.width = pct+'%';
}

function buildSidebar(){
  const sb = document.getElementById('sidebar');
  CATS.forEach(cat=>{
    const count = QA[cat.id]?.length || 0;
    const div = document.createElement('div');
    div.className = 'sidebar-item'+(cat.id===currentCat?' active':'');
    div.innerHTML = `${cat.label}<span class="count">${count}</span>`;
    div.onclick = ()=>{currentCat=cat.id;renderList();buildSidebar()};
    sb.appendChild(div);
  });
}

function getKey(catId, idx){return catId+'_'+idx}

function renderList(filter=''){
  const list = document.getElementById('qa-list');
  const noR = document.getElementById('no-results');
  const hdr = document.getElementById('section-header');
  list.innerHTML = '';
  
  const cat = CATS.find(c=>c.id===currentCat);
  const items = QA[currentCat] || [];
  
  const filtered = filter 
    ? Object.entries(QA).flatMap(([cid,qs])=>qs.map((q,i)=>({...q,cid,i}))).filter(q=>q.q.toLowerCase().includes(filter)||q.a.toLowerCase().includes(filter))
    : items.map((q,i)=>({...q,cid:currentCat,i}));
  
  hdr.textContent = filter ? `${filtered.length} results for "${filter}"` : `${cat?.label} — ${items.length} questions`;
  
  if(filtered.length===0){noR.style.display='block';return}
  noR.style.display='none';
  
  filtered.forEach(({q,a,cid,i})=>{
    const key = getKey(cid,i);
    const item = document.createElement('div');
    item.className = 'qa-item'+(seen[key]?' seen':'');
    
    const qDiv = document.createElement('div');
    qDiv.className = 'qa-q'+(seen[key]?' seen':'');
    qDiv.innerHTML = `<span class="q-text">${i+1}. ${q}</span><span class="q-arrow">▾</span>`;
    
    const aDiv = document.createElement('div');
    aDiv.className = 'qa-a';
    aDiv.innerHTML = a;
    
    qDiv.onclick = ()=>{
      const open = item.classList.toggle('open');
      if(open && !seen[key]){
        seen[key]=true;
        localStorage.setItem('ml_seen',JSON.stringify(seen));
        qDiv.classList.add('seen');
        item.classList.add('seen');
        updateStats();
      }
    };
    
    item.appendChild(qDiv);
    item.appendChild(aDiv);
    list.appendChild(item);
  });
  
  if(expandedAll){
    document.querySelectorAll('.qa-item').forEach(el=>el.classList.add('open'));
  }
}

document.getElementById('search').addEventListener('input',e=>{
  const v = e.target.value.toLowerCase().trim();
  renderList(v);
});

document.getElementById('expand-btn').addEventListener('click',()=>{
  expandedAll = !expandedAll;
  document.querySelectorAll('.qa-item').forEach(el=>{
    el.classList.toggle('open', expandedAll);
  });
  document.getElementById('expand-btn').textContent = expandedAll ? 'Collapse all' : 'Expand all';
});

document.getElementById('reset-btn').addEventListener('click',()=>{
  if(confirm('Reset all progress?')){
    seen={};localStorage.removeItem('ml_seen');
    updateStats();renderList();buildSidebar();
  }
});

buildSidebar();
renderList();
updateStats();
</script>
