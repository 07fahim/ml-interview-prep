const QA = {
ml:[
{q:"What is Machine Learning?",a:"ML is a subset of AI where systems learn patterns from data rather than being explicitly programmed. A model is trained on examples and learns to generalize — making predictions on new, unseen data. Key categories: supervised, unsupervised, and reinforcement learning."},
{q:"Differentiate between Supervised and Unsupervised Learning.",a:"<b>Supervised</b>: Model learns from labeled data (input-output pairs). Goal: learn a mapping function. Examples: classification, regression.<br><br><b>Unsupervised</b>: No labels. Model finds hidden structure in data. Examples: clustering (K-Means), dimensionality reduction (PCA), anomaly detection."},
{q:"What is Reinforcement Learning?",a:"RL is a learning paradigm where an agent interacts with an environment, takes actions, and receives rewards or penalties. The agent learns a policy (which action to take in which state) to maximize cumulative reward over time. Key concepts: state, action, reward, policy, value function."},
{q:"What is Bias in ML?",a:"Bias is the error introduced by overly simplistic assumptions in the learning algorithm. High bias → underfitting (model can't capture patterns). Examples: using linear regression for non-linear data. Also refers to systematic prejudice in model outputs when training data reflects historical inequalities."},
{q:"What is the difference between Classification and Regression?",a:"<b>Classification</b>: predicts a discrete category label (spam/not spam, cat/dog). Output: class label or probability. Metrics: accuracy, F1, AUC.<br><br><b>Regression</b>: predicts a continuous numerical value (house price, temperature). Output: real number. Metrics: MAE, MSE, RMSE, R²."},
{q:"Explain Overfitting and Underfitting. How can you prevent them?",a:"<b>Overfitting</b>: model memorizes training data including noise; poor test performance. Prevention: regularization (L1/L2), dropout, more data, cross-validation, early stopping, simpler model.<br><br><b>Underfitting</b>: model too simple to capture patterns; poor train and test performance. Fix: increase model complexity, more features, longer training, reduce regularization."},
{q:"What Are L1 and L2 Loss Functions?",a:"<b>L1 Loss (MAE)</b>: |y - ŷ|. Robust to outliers; not differentiable at 0; produces sparse solutions.<br><br><b>L2 Loss (MSE)</b>: (y - ŷ)². Differentiable everywhere; penalizes large errors more; sensitive to outliers.<br><br>Use L1 when outliers are present; L2 when outliers are rare and large errors matter more."},
{q:"What is Regularization? Explain L1 (Lasso) and L2 (Ridge).",a:"Regularization adds a penalty to the loss function to prevent overfitting by discouraging large weights.<br><br><b>L1 (Lasso)</b>: adds λ∑|wᵢ| — drives some weights exactly to zero → feature selection, sparse models.<br><br><b>L2 (Ridge)</b>: adds λ∑wᵢ² — shrinks all weights toward zero but rarely to exactly zero → smoother models, handles multicollinearity."},
{q:"What are Loss Functions and Cost Functions?",a:"<b>Loss function</b>: measures error for a single training example (e.g., squared error for one sample).<br><b>Cost function</b>: average loss over the entire training set (e.g., MSE = mean of all squared errors).<br><br>We minimize the cost function during training using gradient descent."},
{q:"What are Dropouts?",a:"Dropout is a regularization technique: during training, randomly set a fraction p of neuron outputs to zero at each forward pass. This prevents neurons from co-adapting and forces the network to learn redundant representations. At inference, all neurons are active but outputs are scaled by (1-p). Reduces overfitting significantly in deep networks."},
{q:"What is a Perceptron?",a:"A perceptron is the simplest neural network unit. It takes inputs x₁...xₙ, multiplies by weights w₁...wₙ, adds bias b, applies a step activation: output = 1 if Σwᵢxᵢ + b > 0, else 0. It's a binary linear classifier. Cannot learn XOR (non-linearly separable problems) — this limitation led to multi-layer networks."},
{q:"Explain Multilayer Perceptron (MLP).",a:"MLP is a feedforward neural network with: input layer → one or more hidden layers → output layer. Each layer is fully connected to the next. Uses non-linear activation functions (ReLU, sigmoid) in hidden layers. Trained via backpropagation + gradient descent. Can learn complex non-linear mappings — a universal function approximator."},
{q:"What is Cross-Entropy?",a:"Cross-entropy measures the difference between two probability distributions — predicted vs true. Formula: CE = -Σ y_true × log(y_pred). For binary classification: CE = -(y log(p) + (1-y) log(1-p)). Used as loss function for classification tasks. Penalizes confident wrong predictions heavily."},
{q:"What are Logits?",a:"Logits are the raw, unnormalized outputs of a neural network before applying a final activation function like softmax or sigmoid. They are real numbers (can be negative). Softmax converts logits to probabilities: softmax(zᵢ) = e^zᵢ / Σe^zⱼ. The term comes from log-odds in statistics."},
{q:"What is Softmax Activation Function?",a:"Softmax converts a vector of raw scores (logits) into a probability distribution: σ(zᵢ) = e^zᵢ / Σⱼe^zⱼ. All outputs sum to 1.0. Used in the final layer of multi-class classifiers. For binary classification, sigmoid is preferred. Softmax emphasizes the largest value (amplifies differences)."},
{q:"What are Embeddings in Machine Learning?",a:"Embeddings are dense, low-dimensional vector representations of high-dimensional data (words, users, items). Instead of one-hot encoding (sparse), embeddings capture semantic relationships. E.g., Word2Vec embeddings place semantically similar words close together in vector space. 'king' - 'man' + 'woman' ≈ 'queen'. Used in NLP, recommendation systems, and graph learning."},
{q:"Explain Epoch, Batch, Batch Size, and Iteration.",a:"<b>Epoch</b>: one complete pass through the entire training dataset.<br><b>Batch</b>: a subset of training data used in one update step.<br><b>Batch size</b>: number of samples per batch (e.g., 32, 64, 128).<br><b>Iteration</b>: one forward + backward pass using one batch.<br><br>If dataset has 1000 samples and batch size = 100 → 10 iterations per epoch."},
{q:"Explain Cross-Validation. Why is it used?",a:"Cross-validation evaluates model performance more reliably by using multiple train/test splits.<br><br><b>K-Fold CV</b>: split data into K folds. Train on K-1, test on 1. Repeat K times, average the results. Gives more stable estimate than a single split. Detects overfitting. Used for model selection and hyperparameter tuning."},
{q:"What are Precision, Recall, and F1 Score?",a:"<b>Precision</b>: TP / (TP + FP) — of all predicted positives, how many are correct?<br><b>Recall</b>: TP / (TP + FN) — of all actual positives, how many did we catch?<br><b>F1 Score</b>: 2 × (Precision × Recall) / (Precision + Recall) — harmonic mean, balances both.<br><br>Use recall when false negatives are costly (cancer detection). Use precision when false positives are costly (spam filter)."},
{q:"What is anomaly detection?",a:"Anomaly detection identifies rare data points that differ significantly from the norm. Approaches: statistical methods (z-score, IQR), ML-based (Isolation Forest, Autoencoder, One-Class SVM), density-based (LOF). Applications: fraud detection, network intrusion, manufacturing defects, medical diagnosis."},
{q:"What is the difference between policy-based and value-based methods in RL?",a:"<b>Value-based</b>: learn a value function V(s) or Q(s,a) that estimates expected return. Derive policy implicitly (pick highest Q). Example: Q-Learning, DQN.<br><br><b>Policy-based</b>: directly parameterize and optimize the policy π(a|s). Example: REINFORCE, PPO, A3C. Works better for continuous action spaces. Policy gradient methods compute gradient of expected reward."},
{q:"What is Q-Learning?",a:"Q-Learning is a model-free RL algorithm that learns the Q-function: Q(s,a) = expected future reward taking action a in state s. Update rule: Q(s,a) ← Q(s,a) + α[r + γ·max Q(s',a') - Q(s,a)]. Off-policy — learns optimal policy while following a different (e.g., epsilon-greedy) behavior policy. DQN extends Q-Learning with neural networks."},
{q:"Explain Exploration vs Exploitation.",a:"The core dilemma in RL: <b>Exploitation</b> = use current knowledge to maximize immediate reward. <b>Exploration</b> = try new actions to discover potentially better strategies.<br><br>Too much exploitation → gets stuck in local optima. Too much exploration → wastes time. Solutions: ε-greedy (explore with probability ε), UCB (optimism under uncertainty), Thompson sampling."},
{q:"Explain the curse of dimensionality.",a:"As the number of features (dimensions) grows, the data becomes increasingly sparse. Distance metrics lose meaning in high dimensions. More data is needed exponentially to maintain statistical significance. Effects: KNN becomes unreliable; overfitting increases; computation becomes expensive.<br><br>Solutions: PCA, feature selection, autoencoders, t-SNE, domain knowledge."},
{q:"Explain Local Loss, Focal Loss, and Gradient Blending in Multi-Task Learning.",a:"<b>Local Loss</b>: compute loss per task independently, don't share gradients across task boundaries — prevents task interference.<br><b>Focal Loss</b>: FL = -(1-pₜ)ᵞ log(pₜ). Reduces weight on easy/well-classified examples, focuses training on hard negatives. Used for class imbalance (object detection).<br><b>Gradient Blending</b>: in MTL, tasks have different learning rates. Gradient blending normalizes gradient magnitudes across tasks for more stable training."},
],
algo:[
{q:"How does a Decision Tree algorithm work?",a:"A Decision Tree recursively splits the data based on feature thresholds to minimize impurity (Gini Index or Entropy for classification, MSE for regression). At each node, it selects the feature and split point that gives the best information gain. Leaves contain predictions. Pros: interpretable, no scaling needed. Cons: prone to overfitting."},
{q:"How do Decision Trees make splits and handle categorical features?",a:"Splits are chosen by maximizing Information Gain = parent_impurity - weighted_child_impurity. Gini Index = 1 - Σpᵢ². Entropy = -Σpᵢ log(pᵢ).<br><br>For categorical features: binary split (one-vs-rest) or multi-way split. For continuous features: try all midpoints between adjacent values as thresholds."},
{q:"How does Random Forest work? How does it reduce variance?",a:"Random Forest is an ensemble of Decision Trees trained with two sources of randomness: (1) Bootstrap sampling — each tree trained on a random subset of data (bagging). (2) Feature randomness — at each split, only a random subset of features (√n) is considered.<br><br>Variance is reduced by averaging predictions of many decorrelated trees. Bias stays similar to a single tree. Robust to overfitting."},
{q:"Explain Ensemble Methods. Why are they powerful?",a:"Ensembles combine multiple models to improve performance. Powerful because: individual model errors cancel out when models are diverse; variance is reduced; bias can be reduced (boosting). Types: <b>Bagging</b> (parallel, reduces variance), <b>Boosting</b> (sequential, reduces bias), <b>Stacking</b> (meta-learning). Wisdom of crowds principle."},
{q:"What is the difference between Bagging and Boosting?",a:"<b>Bagging</b>: train models in parallel on random subsets. Average predictions. Reduces variance. Each model has equal weight. Example: Random Forest.<br><br><b>Boosting</b>: train models sequentially. Each new model focuses on errors of previous ones. Weighted combination. Reduces bias. Examples: AdaBoost, Gradient Boosting, XGBoost."},
{q:"What is Gradient Boosting? How does XGBoost work?",a:"Gradient Boosting builds trees sequentially, each fitting the negative gradient (residuals) of the loss function — effectively doing gradient descent in function space.<br><br>XGBoost improves this with: regularization (L1/L2 on leaf weights), second-order gradient approximation, column and row subsampling, parallel split finding, and pruning. Much faster and more regularized than vanilla GB."},
{q:"What are the key hyperparameters for XGBoost?",a:"<b>n_estimators</b>: number of trees. <b>max_depth</b>: tree depth (controls complexity). <b>learning_rate (eta)</b>: shrinks each tree's contribution. <b>subsample</b>: fraction of rows per tree. <b>colsample_bytree</b>: fraction of features per tree. <b>min_child_weight</b>: controls overfitting. <b>lambda/alpha</b>: L2/L1 regularization. Tune with cross-validation."},
{q:"How does Logistic Regression differ from Linear Regression?",a:"<b>Linear Regression</b>: predicts continuous values. Output: ŷ = wᵀx + b (unbounded real number).<br><b>Logistic Regression</b>: predicts class probabilities. Output: σ(wᵀx + b) where σ is sigmoid, mapping to [0,1]. Uses cross-entropy loss, not MSE. Decision boundary is linear. Despite the name, it's a classification algorithm."},
{q:"How does Logistic Regression work?",a:"Logistic Regression models P(y=1|x) = σ(wᵀx + b) = 1/(1+e^-(wᵀx+b)). Trained by maximizing log-likelihood (equivalent to minimizing cross-entropy loss) via gradient descent. For multi-class: use softmax (multinomial logistic regression). Assumes linear decision boundary."},
{q:"Explain R-squared and Adjusted R-squared.",a:"<b>R²</b>: proportion of variance in y explained by the model. R² = 1 - SS_res/SS_tot. Ranges [0,1]. Higher is better. Problem: always increases when adding features, even useless ones.<br><br><b>Adjusted R²</b>: penalizes for number of predictors. Adj-R² = 1 - (1-R²)(n-1)/(n-k-1). More honest for model comparison."},
{q:"How do you check for multicollinearity?",a:"<b>VIF (Variance Inflation Factor)</b>: VIF > 10 indicates high multicollinearity. <b>Correlation matrix</b>: high pairwise correlations between features. <b>Eigenvalue analysis</b>: small eigenvalues of X'X indicate multicollinearity.<br><br>Solutions: remove correlated features, PCA, Ridge regression (L2 handles multicollinearity naturally)."},
{q:"How does K-Nearest Neighbors (KNN) work?",a:"KNN classifies a new point by finding the K closest training points (using Euclidean or other distance) and taking a majority vote (classification) or average (regression). No explicit training phase — it's a lazy learner. Choose K via cross-validation. Sensitive to feature scaling and the curse of dimensionality. Time complexity O(n) per query."},
{q:"Explain K-Means Clustering.",a:"K-Means partitions n points into K clusters. Algorithm: (1) initialize K centroids randomly, (2) assign each point to nearest centroid, (3) update centroids as mean of assigned points, (4) repeat until convergence.<br><br>Limitations: must specify K; sensitive to initialization (use K-Means++); assumes spherical clusters; sensitive to outliers; not suitable for non-convex shapes."},
{q:"Explain Support Vector Machines (SVM). What is the kernel trick?",a:"SVM finds the hyperplane that maximizes the margin between classes. Support vectors are the closest points to the hyperplane.<br><br><b>Kernel trick</b>: maps data to higher-dimensional space implicitly without computing the transformation explicitly. Common kernels: RBF (Gaussian), polynomial, sigmoid. Allows SVM to find non-linear decision boundaries in original space."},
{q:"What is the decision boundary in classifiers?",a:"The decision boundary is the surface that separates regions of different predicted classes. For logistic regression: a hyperplane (wᵀx + b = 0). For SVM: maximum-margin hyperplane. For decision trees: axis-aligned rectangular regions. For neural networks: complex non-linear surfaces. The boundary is where the model's confidence is 0.5 (equal probability for two classes)."},
{q:"Explain Naive Bayes.",a:"Naive Bayes uses Bayes' theorem P(y|x) ∝ P(y)·∏P(xᵢ|y) with the naive assumption that features are conditionally independent given the class. Despite this strong assumption, it works well in practice especially for text classification. Types: Gaussian NB (continuous features), Multinomial NB (word counts), Bernoulli NB (binary features). Fast and interpretable."},
{q:"What is Dimensionality Reduction?",a:"Dimensionality reduction reduces the number of features while preserving important information. Benefits: removes noise, reduces overfitting, speeds computation, enables visualization.<br><br>Methods: <b>Feature selection</b> (pick subset of original features) and <b>Feature extraction</b> (create new features): PCA, t-SNE, UMAP, Autoencoders, LDA."},
{q:"Explain PCA (Principal Component Analysis).",a:"PCA finds the directions (principal components) of maximum variance in data. Steps: (1) center the data, (2) compute covariance matrix, (3) find eigenvectors/eigenvalues, (4) select top k eigenvectors. Project data onto these components.<br><br>Use when: features are highly correlated, need to reduce dimensionality for speed/visualization, want to remove noise. Limitation: components are hard to interpret."},
{q:"Explain Gradient Descent and its variants.",a:"<b>Gradient Descent</b>: iteratively updates parameters in direction of negative gradient: θ ← θ - α·∇L(θ).<br><b>Batch GD</b>: uses all data. Stable but slow.<br><b>Stochastic GD (SGD)</b>: one sample per update. Noisy but fast.<br><b>Mini-batch GD</b>: uses small batches (32-256). Best of both. Modern standard.<br><b>Momentum, Adam, RMSprop</b>: adaptive learning rate variants."},
{q:"What is the ROC-AUC curve?",a:"ROC (Receiver Operating Characteristic) plots True Positive Rate vs False Positive Rate at various classification thresholds. AUC (Area Under Curve) summarizes performance in one number [0,1]. AUC=0.5 is random; AUC=1.0 is perfect. AUC measures the probability that the model ranks a random positive higher than a random negative. Useful for imbalanced datasets where accuracy is misleading."},
],
feat:[
{q:"What is Feature Engineering?",a:"Feature engineering is the process of using domain knowledge to create, transform, or select input features to improve model performance. Includes: creating new features (ratios, interactions), transforming features (log, sqrt), encoding categoricals, handling missing values, scaling, binning. Often the most impactful step in an ML pipeline."},
{q:"What is one-hot encoding? When should you use it?",a:"One-hot encoding converts a categorical variable with K categories into K binary columns, exactly one being 1. Use for: nominal categories with no ordinal relationship (colors, countries). Don't use for: high-cardinality features (use target encoding or embeddings instead), ordinal features (use label encoding), tree-based models (can handle categoricals directly)."},
{q:"How do you deal with missing data?",a:"<b>Deletion</b>: remove rows/columns with missing values (only if MCAR and small proportion).<br><b>Imputation</b>: mean/median/mode imputation (simple), KNN imputation, iterative imputation (MICE), model-based imputation.<br><b>Flag</b>: add a binary indicator column 'feature_missing'.<br><b>Special value</b>: -999 for trees that can split on it.<br>Best choice depends on missing mechanism: MCAR, MAR, or MNAR."},
{q:"How do you handle Outliers?",a:"Detect: Z-score (|z|>3), IQR method (outside Q1-1.5·IQR or Q3+1.5·IQR), visualization (boxplot, scatterplot).<br><br>Handle: remove (if data entry error), cap/winsorize (replace extremes with percentile values), transform (log scale reduces impact), use robust models (trees, L1 loss, median-based methods), or keep if legitimate signal."},
{q:"Explain Feature Scaling. Why is it needed?",a:"Feature scaling normalizes the range of features. Needed for: gradient-based models (different scales → different gradient magnitudes → slow convergence), distance-based models (KNN, SVM, KMeans — features with larger scales dominate distance).<br><br><b>Min-Max</b>: scale to [0,1]. <b>Standardization</b>: zero mean, unit variance (z = (x-μ)/σ). <b>Robust scaling</b>: uses median/IQR, robust to outliers. Not needed for tree-based models."},
{q:"Explain One-Hot, Label, Target, and K-Fold Target Encoding.",a:"<b>Label encoding</b>: assign integers (0,1,2...) — implies ordinal relationship.<br><b>One-hot</b>: binary columns — for nominal categories.<br><b>Target encoding</b>: replace category with mean target value — captures target relationship, risk of leakage.<br><b>K-Fold target encoding</b>: compute target mean using out-of-fold data only — prevents leakage. Best for high-cardinality categoricals."},
{q:"How do you handle Categorical Features?",a:"Low cardinality (<15 categories): one-hot encoding. Ordinal categories: label/ordinal encoding. High cardinality: target encoding, hash encoding, embeddings. Binary: label encode (0/1). Tree models can often handle categoricals directly. Embeddings are best for very high cardinality (e.g., user IDs, zip codes) in deep learning."},
{q:"Explain Feature Selection vs Feature Extraction.",a:"<b>Feature Selection</b>: choose a subset of original features. Methods: filter (correlation, chi-squared), wrapper (RFE, forward/backward selection), embedded (L1 regularization, tree feature importance). Preserves interpretability.<br><br><b>Feature Extraction</b>: create new features from combinations of original ones. Methods: PCA, LDA, autoencoders. New features may be uninterpretable but capture complex patterns."},
{q:"How would you create new features from existing ones?",a:"Interaction terms (feature_A × feature_B), ratio features (A/B), polynomial features (A²), date/time decomposition (hour, day_of_week, month), lag features for time series, rolling statistics (moving average), aggregations (group-by statistics), text features (TF-IDF, word count), domain-specific features (e.g., BMI = weight/height² in healthcare)."},
{q:"How do you approach a dataset with highly imbalanced classes?",a:"<b>Resampling</b>: oversample minority (SMOTE — synthetic samples), undersample majority, combination (SMOTEENN).<br><b>Class weights</b>: assign higher weight to minority class in loss function.<br><b>Threshold adjustment</b>: lower decision threshold to catch more positives.<br><b>Metrics</b>: use F1, AUC-ROC, precision-recall curve — not accuracy.<br><b>Algorithm choice</b>: tree ensembles handle imbalance better than logistic regression."},
{q:"How do you select features for a model?",a:"(1) Domain knowledge — remove irrelevant features. (2) Correlation analysis — remove highly correlated redundant features. (3) Univariate statistics — chi-squared, ANOVA F-test. (4) L1 regularization — automatically zeros out unimportant features. (5) Tree feature importance — SHAP values for more reliable importances. (6) RFE — recursive feature elimination with cross-validation."},
{q:"Why and how do you split data into train, test, and validation sets?",a:"<b>Train</b>: model learns from this. <b>Validation</b>: hyperparameter tuning and model selection — never touch test during this. <b>Test</b>: final unbiased evaluation — touch only once.<br><br>Typical splits: 70/15/15 or 80/10/10. For time series: always split chronologically. Use stratified split for imbalanced classes. Alternative: K-fold CV on train+val, then evaluate on held-out test."},

{q:"What is Gradient Descent? How does it work?",a:"An iterative optimization algorithm that minimizes a loss function by moving parameters in the direction of the negative gradient. θ ← θ - α · ∂L/∂θ. The gradient points in the direction of steepest increase, so we move opposite to it. Converges to a local minimum (global for convex functions)."},
{q:"What is Stochastic Gradient Descent (SGD)?",a:"SGD updates parameters using one training sample at a time instead of the full dataset. Pros: fast updates, can escape local minima due to noise, works for online learning. Cons: noisy updates, high variance in loss curve. Mini-batch SGD (using batches of 32-256) is the standard in deep learning — balances speed and stability."},
{q:"What are Vanishing Gradients?",a:"In deep networks, gradients shrink exponentially as they propagate backward through many layers (especially with sigmoid/tanh activations whose derivatives are <1). Result: early layers learn very slowly or not at all. Solutions: ReLU activations (gradient=1 for positive values), batch normalization, skip/residual connections, careful weight initialization (Xavier, He)."},
{q:"What is a learning rate? How to choose a good one?",a:"Learning rate α controls step size in gradient descent. Too high → overshoots, diverges. Too low → slow convergence, stuck in local minima.<br><br>Choosing: start with 1e-3 (Adam) or 1e-1 (SGD). Use learning rate schedulers (cosine annealing, step decay). Learning rate warmup. Learning rate finder (cyclical LR method). Use Adam/AdamW which adapt LR per-parameter."},
{q:"How does the learning rate affect model training?",a:"High LR: fast initial progress, may overshoot minimum, training loss may oscillate or diverge. Low LR: stable but very slow, may converge to poor local minimum. Optimal LR: fastest stable convergence. Modern practice: use warm-up (start low, increase), then decay (cosine or step schedule). Adam adapts individual learning rates, making it less sensitive to the global LR."},
{q:"How do you approach hyperparameter tuning?",a:"(1) <b>Grid Search</b>: exhaustive search over predefined values. Good for small spaces. (2) <b>Random Search</b>: randomly sample combinations. More efficient than grid for large spaces. (3) <b>Bayesian Optimization</b>: build probabilistic model of objective, use it to select next hyperparameters intelligently. (4) Use early stopping to avoid wasting compute. Tools: Optuna, Hyperopt, Ray Tune."},
{q:"What is model quantization?",a:"Quantization reduces model size and inference speed by representing weights/activations with lower precision (e.g., float32 → int8 or float16). Types: Post-Training Quantization (PTQ): quantize after training. Quantization-Aware Training (QAT): simulate quantization during training for better accuracy. Benefits: 4x smaller model, 2-4x faster inference, works well on edge/mobile devices."},
{q:"How do you ensure fairness and reduce bias in ML models?",a:"(1) Audit training data for representation bias. (2) Use fairness metrics: demographic parity, equalized odds, individual fairness. (3) Reweighting/resampling to balance groups. (4) Adversarial debiasing. (5) Fairness constraints during training. (6) Post-processing: adjust thresholds per group. (7) Regular audits in production. Tools: Fairlearn, AIF360."},
{q:"Explain Grid Search vs Random Search vs Bayesian Optimization.",a:"<b>Grid Search</b>: tries every combination in a grid — exhaustive but exponentially slow. <b>Random Search</b>: samples random combinations — often finds good solutions 10x faster than grid. <b>Bayesian Optimization</b>: uses past evaluations to build a surrogate model (Gaussian Process or TPE) and intelligently picks next point. Best for expensive evaluations (deep learning)."},
{q:"Explain TPE Hyperparameter Optimization.",a:"Tree-structured Parzen Estimator (TPE) is a Bayesian optimization method. It models P(hyperparameters | good results) and P(hyperparameters | bad results) separately using kernel density estimators. Next hyperparameters chosen by maximizing: P(good)/P(bad) — the Expected Improvement proxy. Used in Hyperopt and Optuna. More efficient than Gaussian Process for complex, high-dimensional HP spaces."},
{q:"Explain Adam Optimizer.",a:"Adam (Adaptive Moment Estimation) combines momentum and RMSprop. Maintains: m = β₁m + (1-β₁)g (1st moment, momentum), v = β₂v + (1-β₂)g² (2nd moment, RMSprop). Bias-corrected: m̂ = m/(1-β₁ᵗ), v̂ = v/(1-β₂ᵗ). Update: θ ← θ - α·m̂/(√v̂+ε). Defaults: β₁=0.9, β₂=0.999, ε=1e-8. Adapts LR per parameter; works well with sparse gradients."},
{q:"Explain the RMSprop Optimizer.",a:"RMSprop maintains a moving average of squared gradients to adapt learning rate: v ← βv + (1-β)g². Update: θ ← θ - (α/√(v+ε))·g. Divides learning rate by root of recent squared gradients — reduces LR for frequently updated parameters (large gradients), increases for infrequent ones. Solves the diminishing LR problem of Adagrad. Works well for RNNs."},
{q:"What is the Adagrad Optimizer?",a:"Adagrad adapts learning rate per parameter based on historical gradients: G += g², θ ← θ - (α/√(G+ε))·g. Parameters with large historical gradients get smaller updates. Good for sparse data (NLP, text). Problem: G keeps accumulating → LR becomes infinitesimally small over time → stops learning. RMSprop and Adam fix this with exponential moving averages."},

dl:[
{q:"What are neural networks?",a:"Neural networks are computational systems loosely inspired by the brain. They consist of layers of interconnected nodes (neurons) that transform inputs through learned weights. Each neuron computes: output = activation(Σwᵢxᵢ + b). Stacking layers allows learning hierarchical representations. Deep networks (many layers) can learn complex patterns."},
{q:"Explain the Feedforward Neural Network.",a:"Data flows in one direction: input → hidden layers → output. No cycles. Each layer applies: h = activation(Wh + b). Common activations: ReLU (hidden layers), softmax/sigmoid (output layer). Trained via backpropagation. The most basic deep learning architecture — foundation for CNNs, RNNs, Transformers."},
{q:"What are forward and backward propagation?",a:"<b>Forward propagation</b>: input flows through network layer by layer, computing activations until reaching the output and loss.<br><br><b>Backward propagation</b>: compute gradients of loss w.r.t. each parameter using the chain rule, propagating from output to input. Gradients are used to update weights via gradient descent: ∂L/∂W = ∂L/∂h · ∂h/∂W."},
{q:"What is backpropagation?",a:"Backpropagation is the algorithm for computing gradients in neural networks using the chain rule of calculus. Starting from the loss, it propagates gradient information backward through each layer. For layer l: δˡ = (Wˡ⁺¹)ᵀδˡ⁺¹ ⊙ σ'(zˡ). Gradients: ∂L/∂Wˡ = δˡ(aˡ⁻¹)ᵀ. Allows efficient O(n) computation of all gradients simultaneously."},
{q:"What are activation functions, and why are they used?",a:"Activation functions introduce non-linearity into the network. Without them, any number of linear layers = a single linear transformation (can only learn linear mappings). Non-linearity allows learning complex patterns. Common choices: ReLU (hidden layers), sigmoid/softmax (output for classification), tanh, LeakyReLU."},
{q:"Explain Sigmoid, Tanh, ReLU, LeakyReLU, and Softmax.",a:"<b>Sigmoid</b>: σ(x)=1/(1+e⁻ˣ) → (0,1). Vanishing gradients; use for binary output.<br><b>Tanh</b>: (-1,1). Zero-centered; still vanishing gradient issue in hidden layers.<br><b>ReLU</b>: max(0,x). No vanishing gradient for positive x; fast; dying ReLU problem.<br><b>LeakyReLU</b>: max(αx,x), α=0.01. Fixes dying ReLU.<br><b>Softmax</b>: converts logits to probabilities summing to 1; use for multi-class output."},
{q:"Why are Sigmoid and Tanh not preferred in hidden layers?",a:"Both suffer from the vanishing gradient problem. Their derivatives are very small (sigmoid: max 0.25; tanh: max 1 at center but approaches 0 at extremes). When multiplied across many layers during backprop, gradients shrink exponentially → early layers learn extremely slowly. ReLU has a gradient of 1 for positive inputs, avoiding this issue."},
{q:"What is dropout, and why is it effective?",a:"Dropout randomly zeroes a fraction p of neuron outputs during training. Effectiveness: prevents co-adaptation (neurons can't rely on specific other neurons); acts like training an ensemble of 2ⁿ different network architectures; forces redundant representations. At inference, no dropout, but outputs scaled by (1-p). Typical rates: 0.2-0.5. Most effective in fully connected layers."},
{q:"What is the effect of dropout on training vs inference speed?",a:"Training: slight slowdown per epoch since we zero activations and still compute/update remaining weights, but convergence may need more epochs. Inference: no dropout applied — all neurons active, no slowdown, often slightly faster than during training because no random masking computation. Scale outputs by (1-p) at inference or scale by 1/(1-p) during training (inverted dropout)."},
{q:"What is batch normalization?",a:"Batch normalization normalizes layer inputs to have zero mean and unit variance within a mini-batch: x̂ = (x-μ_batch)/σ_batch, then scale and shift: y = γx̂ + β (γ,β learned). Benefits: allows higher learning rates, reduces dependence on initialization, acts as mild regularizer. Applied before or after activation. At inference, uses running mean/variance from training."},
{q:"What are the hyperparameters for batch normalization?",a:"<b>γ (scale)</b> and <b>β (shift)</b>: learned parameters, initialized to 1 and 0 respectively — allow the network to undo normalization if needed. <b>Momentum</b>: for running mean/variance update (default 0.1 in PyTorch). <b>Epsilon</b>: small value for numerical stability (1e-5). Placement: before or after activation (debated, but before activation is common)."},
{q:"What is parameter sharing in deep learning?",a:"Parameter sharing means the same weight is used across multiple positions in the input. Key example: CNNs — the same convolutional filter slides across all positions in an image, drastically reducing parameters. This builds in translation invariance and works because local patterns (edges, textures) appear at different locations. RNNs share weights across timesteps. Transformers share attention weights."},
{q:"What is representation learning?",a:"Representation learning is learning useful internal representations of data automatically, rather than hand-crafting features. Deep networks learn hierarchical representations: early layers → edges/textures, later layers → objects/semantics. Examples: word embeddings (Word2Vec, BERT), image features (CNN pretrained on ImageNet), contrastive learning (SimCLR). Key insight: good representations make downstream tasks easier."},
{q:"What is a generative model vs discriminative model?",a:"<b>Discriminative</b>: models P(y|x) — the boundary between classes. Predicts labels given features. Examples: logistic regression, SVM, neural classifiers. Generally better classification accuracy.<br><br><b>Generative</b>: models the joint P(x,y) or P(x). Can generate new samples. Examples: Naive Bayes, GANs, VAEs, diffusion models. Used for data generation, density estimation, anomaly detection."},
{q:"Explain Encoder-Decoder Architecture.",a:"Encoder maps input to a compact latent representation (bottleneck). Decoder maps latent to output. Used in: autoencoders (x→z→x̂), seq2seq models (sentence→vector→translation), image segmentation (image→features→segmentation map), VAEs.<br><br>The encoder learns to compress; the decoder learns to reconstruct. Skip connections (U-Net) pass encoder features directly to decoder."},
{q:"What is Latent Space?",a:"The latent space is the compressed, lower-dimensional representation learned by an encoder. Each point in latent space corresponds to a pattern in the input data. Well-structured latent spaces are smooth and continuous — nearby points produce similar outputs. VAEs enforce a structured (Gaussian) latent space. Interpolating between two latent vectors produces semantically meaningful intermediate outputs."},
{q:"What are autoencoders?",a:"An autoencoder is an unsupervised neural network trained to reconstruct its input through a bottleneck. Architecture: Encoder (input → latent z) + Decoder (z → output). Loss = reconstruction error. Uses: dimensionality reduction, denoising (denoising autoencoders), anomaly detection (high reconstruction error = anomaly), pretraining, data compression."},
{q:"What is a Variational Autoencoder (VAE)?",a:"VAE is a generative model that encodes inputs to a probability distribution (μ and σ) rather than a single point in latent space. Samples z ~ N(μ,σ²) from this distribution. Training loss = reconstruction loss + KL divergence (forces distribution toward N(0,1)). Enables smooth latent space where interpolation generates meaningful new samples. Reparameterization trick makes backprop possible."},
{q:"How does VAE impose probabilistic structure on the latent space?",a:"The encoder outputs μ(x) and σ(x) (mean and std of latent distribution). The KL divergence term KL[q(z|x) || p(z)] pushes this distribution toward a standard normal N(0,I). This ensures the latent space is dense and organized — prevents 'holes' where the decoder gives nonsense. At generation time, sample z ~ N(0,I) and decode. The balance between reconstruction and KL is controlled by β (β-VAE)."},
{q:"What is the architecture of a GAN?",a:"A GAN has two networks in adversarial training: <b>Generator G</b>: takes random noise z → generates fake data G(z). <b>Discriminator D</b>: takes real or fake data → outputs probability of being real. Training: D maximizes its accuracy; G tries to fool D. Objective: min_G max_D E[log D(x)] + E[log(1-D(G(z)))]. They play a minimax game until G generates realistic data."},
{q:"What are the roles of Generator and Discriminator in a GAN?",a:"<b>Generator</b>: learns the data distribution. Takes random noise (latent vector) and produces synthetic samples indistinguishable from real data. Wants D to output 1 (real) for its outputs. Goal: min log(1-D(G(z))).<br><br><b>Discriminator</b>: binary classifier — real vs fake. Wants to correctly label real as 1 and fake as 0. Goal: max log D(x) + log(1-D(G(z))). Provides gradient signal to G."},
{q:"What is mode collapse in GANs and how to mitigate it?",a:"Mode collapse occurs when the Generator produces only a limited variety of outputs (ignoring most of the real data distribution) because it found a few samples that consistently fool D. Mitigations: Minibatch discrimination (D sees batches, not individual samples), feature matching (G matches D's intermediate features), Wasserstein GAN (WGAN — uses Wasserstein distance, more stable training), gradient penalty, progressive growing (ProGAN)."},
{q:"How are GANs used in image synthesis?",a:"GANs generate photorealistic images by training Generator to produce images that fool the Discriminator trained on real images. Applications: face generation (StyleGAN — photorealistic faces of non-existent people), image-to-image translation (pix2pix — sketch→photo, horse→zebra using CycleGAN), super-resolution (SRGAN), video generation, data augmentation, artistic style transfer."},
{q:"Explain Convolutional Neural Networks (CNN).",a:"CNN exploits spatial structure in images. Key components: <b>Conv layers</b>: learn local features using shared filters. <b>Pooling</b>: downsample spatial dimensions. <b>FC layers</b>: final classification. Convolution = sliding a filter over input computing dot products. Early layers detect edges/textures; deep layers detect objects. Translation invariant due to weight sharing."},
{q:"Explain filters, stride, padding, and pooling in CNN.",a:"<b>Filters (kernels)</b>: learnable weight matrices that detect features (edges, textures). <b>Stride</b>: step size of filter sliding — stride 2 halves output size. <b>Padding</b>: add zeros around input border ('same' padding keeps output size, 'valid' reduces it). <b>Pooling</b>: reduces spatial size. Max pooling: takes max in each window (keeps strongest activation). Average pooling: takes mean."},
{q:"What is a Recurrent Neural Network (RNN)?",a:"RNN processes sequential data by maintaining a hidden state hₜ = f(hₜ₋₁, xₜ). Information persists from one timestep to the next. Unrolled over time. Uses: time series, language modeling, speech. Limitations: vanishing/exploding gradients over long sequences; slow sequential computation (can't parallelize). LSTMs and GRUs address the gradient problems."},
{q:"What are the limitations of RNNs and how are they solved?",a:"<b>Vanishing gradients</b>: gradients shrink over long sequences → can't learn long-range dependencies. Fixed by LSTM/GRU (gating mechanisms).<br><b>Exploding gradients</b>: fixed by gradient clipping.<br><b>Sequential computation</b>: can't parallelize across timesteps → slow training. Fixed by Transformers (parallel attention).<br><b>Memory</b>: hard to selectively remember/forget. Fixed by attention mechanisms."},
{q:"What are LSTM and GRU?",a:"<b>LSTM</b>: has cell state (long-term memory) + hidden state, controlled by 3 gates: Forget gate (what to forget), Input gate (what to write to cell), Output gate (what to read from cell). Handles sequences of 100s-1000s steps.<br><br><b>GRU</b>: simpler version with 2 gates (reset + update). Fewer parameters than LSTM, often comparable performance, faster training."},
{q:"What are the main gates in LSTM?",a:"<b>Forget gate</b>: fₜ = σ(Wf·[hₜ₋₁, xₜ] + bf). Decides what fraction of cell state to keep (0=forget all, 1=keep all).<br><b>Input gate</b>: iₜ = σ(Wi·[hₜ₋₁, xₜ]). Decides which cell state values to update. <b>Cell candidate</b>: C̃ₜ = tanh(Wc·[hₜ₋₁, xₜ]). New candidate values.<br><b>Output gate</b>: oₜ = σ(Wo·[hₜ₋₁, xₜ]). Decides output from cell state."},
{q:"How to identify exploding gradient issues?",a:"Signs: loss becomes NaN or Inf; gradients are NaN; weights explode to very large values; training is highly unstable. Detection: monitor gradient norms (log ||∇||₂). Solution: <b>Gradient clipping</b>: if ||g|| > threshold, scale g = g × (threshold/||g||). Common threshold: 1.0 for RNNs. Also: better initialization, lower learning rate, batch normalization."},
{q:"What is the Transformer architecture?",a:"Transformer (Vaswani et al. 2017) replaces recurrence with self-attention. Architecture: Encoder + Decoder stacks. Each encoder layer: Multi-Head Self-Attention → Add&Norm → Feed-Forward → Add&Norm. Decoder adds masked attention + cross-attention. Key advantages: full parallelization (vs RNN's sequential), attends to all positions equally, scales better with data/compute."},
{q:"What is the Attention mechanism?",a:"Attention allows a model to focus on different parts of the input when producing each output. Computes weighted sum of Values (V) based on compatibility between Query (Q) and Keys (K): Attention(Q,K,V) = softmax(QKᵀ/√dₖ)V. The √dₖ scaling prevents dot products from growing large (which would push softmax into saturation). Each position can attend to all other positions in parallel."},
{q:"What is the basic difference between LSTM and Transformers?",a:"<b>LSTM</b>: sequential processing (one step at a time); information compressed into fixed-size hidden state; O(n) time steps to connect distant positions; harder to parallelize; better for short-medium sequences.<br><br><b>Transformer</b>: parallel processing via attention; direct connections between any two positions (O(1) path length); O(n²) attention but parallelizable; requires positional encoding; scales better; now dominates NLP."},
{q:"Why does Diffusion work better than Auto-Regression for image generation?",a:"Auto-regressive models (GPT-style) generate pixels/tokens sequentially — slow, errors compound, hard to model 2D spatial structure. Diffusion models learn to reverse a gradual noising process — the denoising network sees the entire image at each step, allowing global coherence. Diffusion: better sample quality (FID scores), more controllable (classifier guidance, ControlNet), parallelizable within steps. Auto-regression: better for discrete/text data."},
{q:"Explain transfer learning.",a:"Transfer learning uses a model pre-trained on a large dataset (source domain) and adapts it to a new task (target domain). Benefits: requires less labeled data, faster training, better performance especially with small datasets.<br><br>Approaches: <b>Feature extraction</b>: freeze pretrained layers, only train new head. <b>Fine-tuning</b>: unfreeze some or all layers, train with small LR. Example: use ImageNet-pretrained ResNet for medical imaging."},

nlp:[
{q:"What are the advantages of Transformers over seq2seq models?",a:"Traditional seq2seq (encoder-decoder RNNs) compress the entire input into one vector (information bottleneck). Transformers: no bottleneck (attention over all positions), parallel computation across sequence, direct path between any two tokens (no long-range gradient issue), scales much better to long sequences and large datasets. Attention also gives interpretable alignment."},
{q:"What are the limitations of Transformers?",a:"O(n²) memory and compute in attention — quadratic in sequence length (limits context to ~2K-128K tokens). Position-agnostic without positional encoding. No inherent recurrence (requires positional encoding for sequence order). Large memory footprint. Addressed by: Sparse attention (Longformer, BigBird), FlashAttention (efficient implementation), RoPE/ALiBi (better positional encoding), sliding window attention."},
{q:"What is BERT and how does it improve language understanding?",a:"BERT (Bidirectional Encoder Representations from Transformers) is pretrained on: (1) Masked Language Modeling (MLM): predict 15% of randomly masked tokens using context from both directions — bidirectional unlike GPT. (2) Next Sentence Prediction. Fine-tuned for downstream tasks. Key insight: bidirectional context captures richer representations than left-to-right models. Foundation for many NLP benchmarks."},
{q:"How are Transformers trained (pretraining and fine-tuning)?",a:"<b>Pretraining</b>: train on massive unlabeled text using self-supervised objectives: causal LM (predict next token — GPT), masked LM (predict masked tokens — BERT), or both. Learns general language representations.<br><br><b>Fine-tuning</b>: add task-specific head, train on labeled task data with much smaller LR. Can fine-tune all layers or just the head. PEFT methods (LoRA, adapters) allow efficient fine-tuning."},
{q:"What are Seq2Seq models?",a:"Seq2Seq models map input sequences to output sequences of potentially different length. Architecture: Encoder RNN encodes input to context vector → Decoder RNN generates output token by token. Used for: machine translation, summarization, question answering, speech recognition. Main limitation: fixed-size context vector bottleneck. Attention mechanism was invented to fix this — foundation of Transformers."},
{q:"Compare N-gram models and deep learning models.",a:"<b>N-gram</b>: count-based, uses co-occurrence statistics of N words. Simple, fast, interpretable, no training. Problems: sparsity (unseen n-grams), no semantic understanding, doesn't scale to large n.<br><br><b>Deep learning (LSTMs, Transformers)</b>: learns distributed representations, handles long-range dependencies, generalizes to unseen combinations, significantly better perplexity. Trade-offs: needs much more data/compute, less interpretable."},
{q:"What is the N-gram model?",a:"An n-gram model estimates probability of a word given n-1 preceding words: P(wₙ|w₁...wₙ₋₁) ≈ P(wₙ|wₙ₋ₙ₊₁...wₙ₋₁). Uses maximum likelihood estimation from corpus counts. Unigram (n=1), bigram (n=2), trigram (n=3). Smoothing (Laplace, Kneser-Ney) handles zero counts. Simple baseline for language modeling and speech recognition."},
{q:"What is TF-IDF and how does it differ from word embeddings?",a:"<b>TF-IDF</b>: Term Frequency × Inverse Document Frequency = how important a word is to a document in a corpus. TF = word_count/doc_length, IDF = log(N/df). Sparse, high-dimensional vector. No semantic meaning — doesn't know 'king' and 'queen' are related.<br><br><b>Word embeddings</b>: dense, low-dimensional vectors trained to capture semantic similarity. 'king' and 'queen' are close in embedding space."},
{q:"What is Bag-of-Words?",a:"BoW represents text as a vector of word counts, ignoring word order. Each dimension corresponds to a vocabulary word. Simple and fast, works as baseline. Problems: no semantic meaning, no word order ('dog bites man' = 'man bites dog'), high-dimensional sparse vectors, doesn't capture context. Improved by TF-IDF (weighting). Replaced by embeddings in modern NLP."},
{q:"What is perplexity in NLP?",a:"Perplexity measures how well a language model predicts a test corpus. PP(W) = 2^(-1/N · Σlog₂P(wᵢ|context)). Lower perplexity = better model (more confident correct predictions). Intuition: perplexity = effective vocabulary size the model is 'confused between' at each step. A perplexity of 100 means the model is as confused as if choosing uniformly from 100 words."},
{q:"What is stemming vs lemmatization?",a:"Both reduce words to their base form for NLP preprocessing.<br><b>Stemming</b>: rule-based, chops word suffixes. Fast but crude. 'studies' → 'studi', 'running' → 'run'. May produce non-words. Porter Stemmer.<br><br><b>Lemmatization</b>: linguistically correct base form using vocabulary and morphological analysis. 'studies' → 'study', 'better' → 'good'. Slower but more accurate. Uses WordNet (NLTK)."},
{q:"What is Latent Semantic Indexing (LSI)?",a:"LSI applies SVD to the TF-IDF matrix to find latent topics. Decomposes term-document matrix into lower-rank approximation. Similar documents share similar topic vectors even if they use different words (handles synonymy). Also reduces polysemy (word with multiple meanings). Used in information retrieval and document similarity. Predecessor to topic modeling (LDA) and word embeddings."},
{q:"What is dependency parsing?",a:"Dependency parsing analyzes grammatical structure of a sentence, identifying relationships between words. Creates a dependency tree: 'The dog ate the bone' → ate is root, dog is subject (nsubj), bone is object (dobj), The modifies dog/bone (det). Used in: information extraction, QA, relation extraction, machine translation. Tools: spaCy, StanfordNLP."},
{q:"What are approaches to text summarization?",a:"<b>Extractive</b>: select and stitch together the most important sentences from source. Simple, factually faithful. Methods: TextRank (graph-based), TF-IDF scoring, BERT-based scoring.<br><br><b>Abstractive</b>: generate new text paraphrasing the key points. More flexible, can produce concise summaries. Methods: seq2seq + attention, T5, BART, GPT. Challenges: hallucination, factual consistency."},
{q:"What are Word Embeddings and Word2Vec?",a:"Word embeddings are dense vector representations of words that capture semantic meaning. Similar words have similar vectors.<br><br><b>Word2Vec</b>: trains shallow neural network with two methods: <b>CBOW</b>: predict center word from context words. <b>Skip-gram</b>: predict context words from center word. Result: 300-dim vectors where arithmetic works: king - man + woman ≈ queen."},
{q:"What is t-SNE and how is it used in NLP?",a:"t-SNE (t-distributed Stochastic Neighbor Embedding) is a dimensionality reduction technique for visualization. Maps high-dimensional embeddings to 2D/3D while preserving local structure (nearby points stay nearby). Used to visualize word/sentence embeddings — reveals semantic clusters. t-distribution in low-D space prevents 'crowding problem'. Not suitable for downstream ML tasks — only for visualization."},

{q:"What is computer vision?",a:"Computer vision enables machines to interpret and understand visual information from images and videos. Tasks: image classification, object detection, image segmentation, optical flow, depth estimation, 3D reconstruction, image generation. Applications: autonomous vehicles, medical imaging, facial recognition, augmented reality, quality inspection."},
{q:"What is image segmentation?",a:"Image segmentation assigns a label to every pixel. Types: <b>Semantic segmentation</b>: label each pixel by class (road, sky, person) — no instance distinction. <b>Instance segmentation</b>: distinguish individual objects of same class. <b>Panoptic</b>: combines both. Methods: FCN, U-Net (medical imaging), Mask R-CNN (instance), SAM (Segment Anything Model). Applications: medical imaging, autonomous driving."},
{q:"What is object detection vs image classification?",a:"<b>Image classification</b>: single label for entire image ('cat'). No localization.<br><b>Object detection</b>: locate and classify all objects in image — outputs bounding boxes + class labels. Methods: two-stage (Faster R-CNN: region proposal → classification) and one-stage (YOLO, SSD: direct prediction, faster). Modern: DETR uses Transformers for detection."},
{q:"What are the steps to build an image recognition system?",a:"(1) Data collection and annotation. (2) Data augmentation (flips, crops, color jitter, rotation). (3) Choose architecture (ResNet, EfficientNet, ViT). (4) Transfer learning from ImageNet pretrained weights. (5) Fine-tune on your data. (6) Evaluate: top-1/top-5 accuracy, confusion matrix. (7) Error analysis — look at misclassified examples. (8) Deploy with ONNX/TorchScript for inference optimization."},
{q:"What are challenges in real-time object tracking?",a:"Occlusion (object hidden behind another), scale variation (object changes size), motion blur, background clutter, fast movement, identity switches (ID switching between tracked objects), appearance changes (lighting, pose), computational constraints (must run at 30+ FPS). Methods: SORT, DeepSORT (appearance + motion), ByteTrack. Challenges: maintaining ID consistency across frames."},
{q:"What is feature extraction in computer vision?",a:"Extracting meaningful features from images for downstream tasks. Traditional: SIFT, HOG, LBP — hand-crafted, invariant to scale/rotation. Deep learning: CNN features from intermediate layers (especially penultimate FC layer) capture semantically rich representations. Used for: transfer learning, image retrieval, face verification. Pre-trained CNNs (ResNet, VGG) as feature extractors without fine-tuning."},
{q:"What is OCR?",a:"Optical Character Recognition converts images of text into machine-readable text. Pipeline: image preprocessing (binarization, deskewing) → text detection (find text regions) → text recognition (CRNN, Transformer-based). Applications: digitizing documents, license plate reading, form processing, accessibility. Tools: Tesseract (open-source), PaddleOCR, Google Cloud Vision. Challenges: handwriting, degraded documents, multiple languages."},
{q:"How does CNN differ from traditional neural networks for vision?",a:"Traditional MLP: treats each pixel as independent input, ignores spatial structure, has too many parameters for high-res images. CNN: (1) local connectivity (filters look at small patches), (2) weight sharing (same filter across all positions), (3) hierarchical feature learning (edges→textures→objects). 10-100x fewer parameters, translation invariant, much better for image data."},
{q:"What is data augmentation?",a:"Artificially expanding training data by applying transformations that preserve labels. Common techniques: horizontal/vertical flip, random crop, rotation, color jitter (brightness, contrast, saturation), adding noise, cutout/CutMix/MixUp, elastic deformation. Benefits: reduces overfitting, improves generalization, simulates real-world variation. Libraries: torchvision.transforms, albumentations (faster), imgaug."},
{q:"How can Transformers be used for computer vision?",a:"<b>Vision Transformer (ViT)</b>: split image into 16×16 patches → flatten → linear embedding → positional encoding → Transformer encoder → classification head. Works best with large datasets (ImageNet-21k, JFT-300M). <b>Swin Transformer</b>: hierarchical ViT with shifted windows — works better on dense prediction tasks. Now competitive with or surpassing CNNs on most CV benchmarks."},

llm:[
{q:"What is a Large Language Model (LLM)?",a:"LLMs are neural networks (Transformer-based) trained on massive text corpora to model language. They learn to predict the next token given context, which forces learning of grammar, facts, reasoning, and world knowledge. Scale (parameters + data + compute) is key — capabilities emerge at scale. Examples: GPT-4, Claude, Gemini, LLaMA. Used for: text generation, QA, summarization, coding, reasoning."},
{q:"What is the Transformer architecture?",a:"Transformer (Vaswani 2017): input tokens → embeddings + positional encoding → N stacked encoder/decoder blocks. Each block: Multi-Head Self-Attention (parallel attention heads) → Add & Layer Norm → Feed-Forward Network (two linear + ReLU) → Add & Layer Norm. Decoder adds masked self-attention + cross-attention to encoder. Fully parallelizable, scales to billions of parameters."},
{q:"What are the key components of the Transformer architecture?",a:"(1) <b>Token embedding</b> + positional encoding. (2) <b>Multi-head self-attention</b>: Q,K,V projections; scaled dot-product attention; multiple heads for different relationships. (3) <b>Add & LayerNorm</b>: residual connections stabilize training. (4) <b>Feed-Forward Network</b>: two linear layers with ReLU/GELU. (5) <b>Output projection</b> to vocabulary for next-token prediction."},
{q:"Why do we scale dot product attention by √dₖ?",a:"The dot product QKᵀ has variance that grows with dimension dₖ (key dimension). Large dot products push softmax into regions of very small gradients (saturation). Dividing by √dₖ normalizes the variance back to ~1, keeping the softmax in a regime with meaningful gradients. Without scaling: gradient vanishing in attention; training instability with large models."},
{q:"What is KV Cache in LLMs?",a:"During autoregressive generation, each new token attends to all previous tokens. Without caching, KV pairs are recomputed for all previous tokens at each step — O(n²) redundant computation. KV Cache stores Key and Value matrices for all past tokens in memory. Each step only computes K,V for the new token and retrieves cached K,V for previous ones. Reduces generation from O(n²) to O(n) compute. Essential for practical inference."},
{q:"What is Paged Attention in LLMs?",a:"Paged Attention (vLLM) manages the KV cache memory inspired by OS virtual memory paging. Instead of pre-allocating a contiguous block for each sequence's KV cache (wasteful), it allocates memory in fixed-size 'blocks' (pages). Multiple requests can share pages (prefix sharing). Reduces memory waste from 60-80% to <4%. Enables higher throughput and batch sizes. Used in vLLM, TGI."},
{q:"What is Flash Attention?",a:"Flash Attention is an IO-aware exact attention algorithm. Standard attention loads Q,K,V from HBM (slow GPU memory), computes attention matrix (O(n²) memory), writes result back. Flash Attention uses tiling to compute attention in SRAM (fast on-chip memory) in tiles, never materializing the full n×n attention matrix. Result: same mathematical output but 2-4x faster, O(n) memory instead of O(n²). Flash Attention 2 and 3 further improve speed."},
{q:"What is pre-training vs fine-tuning in LLMs?",a:"<b>Pre-training</b>: train on massive unlabeled text (hundreds of billions of tokens) with next-token prediction. Model learns general language, knowledge, and reasoning. Computationally expensive (millions of GPU-hours).<br><br><b>Fine-tuning</b>: further train on specific task data with labeled examples. Specializes the model. Types: full fine-tuning, PEFT (LoRA, prefix tuning), instruction tuning, RLHF. Much cheaper than pretraining."},
{q:"What are some challenges in training LLMs?",a:"(1) Compute scale (thousands of GPUs needed). (2) Data quality — filtering web crawls. (3) Training stability — loss spikes, gradient explosions. (4) Distributed training (model parallelism, pipeline parallelism, tensor parallelism). (5) Alignment — making models helpful and safe (RLHF, RLAIF). (6) Long context — attention scales quadratically. (7) Catastrophic forgetting during fine-tuning."},
{q:"What is zero-shot learning in LLMs?",a:"Zero-shot: model performs a task without any task-specific examples in the prompt — relies purely on knowledge from pretraining. Example: 'Translate to French: Hello' — no translation examples given. Few-shot: provide K examples of input-output pairs in the prompt (in-context learning). LLMs' ability to do zero-shot/few-shot is an emergent property of scale."},
{q:"Explain Q, K, V in attention.",a:"In attention, each token produces three vectors: <b>Query (Q)</b>: 'what am I looking for?' <b>Key (K)</b>: 'what do I contain?' <b>Value (V)</b>: 'what information do I provide?'.<br><br>Attention score = softmax(QKᵀ/√dₖ) — how relevant each token is to the query. Output = sum of Values weighted by attention scores. Q,K,V are linear projections of the same input embedding (in self-attention)."},
{q:"What is self-attention?",a:"Self-attention allows each token to attend to every other token in the same sequence. Q, K, V are all derived from the same input sequence. Each output position is a weighted sum of all input positions. Captures: syntactic relationships, coreference (pronoun → noun), long-range dependencies. Parallel computation — all positions computed simultaneously (unlike RNNs)."},
{q:"What are multi-head attention mechanisms?",a:"Multi-head attention runs H attention heads in parallel, each with different Q,K,V projections (Wᵢq,Wᵢk,Wᵢv). Each head learns different relationship types (some focus on syntax, others on semantics, others on position). Outputs concatenated and projected: MHA = Concat(head₁...headₕ)Wᵒ. Typical: dmodel=512, H=8, each head dₖ=64. Richer representation than single-head attention."},
{q:"What is Grouped-Query Attention (GQA)?",a:"In standard Multi-Head Attention, each query head has its own K and V head. In GQA, multiple query heads share the same K and V head. This reduces KV cache size by (H/G) where G is number of KV groups. Multi-Query Attention (MQA) is the extreme case (1 KV group for all queries). GQA balances quality (better than MQA) and efficiency (better than MHA for KV cache). Used in LLaMA 2/3, Mistral."},
{q:"What are Feed-Forward Networks in LLMs?",a:"Each Transformer block has a FFN after attention: FFN(x) = max(0, xW₁ + b₁)W₂ + b₂ — two linear layers with ReLU/GELU. Dimension is typically 4× the model dimension (dff = 4×dmodel). FFNs store factual knowledge (evidence from probing studies). In MoE models, multiple expert FFNs, only a few active per token (sparse computation). Accounts for ~⅔ of model parameters."},
{q:"What is tokenization in LLMs?",a:"Tokenization splits text into discrete tokens (integers) that the model processes. Subword methods balance vocabulary size and coverage. <b>BPE</b>: byte pair encoding — merge most frequent pairs iteratively. <b>WordPiece</b> (BERT): similar, used for multilingual. <b>Unigram</b> (SentencePiece): probabilistic. Typical vocabulary: 32k-128k tokens. 'Tokenization' is tokenized as ['Token', 'ization'] in GPT-2."},
{q:"What is BPE (Byte Pair Encoding)?",a:"BPE starts with characters, then iteratively merges the most frequent adjacent pair of symbols. Algorithm: (1) initialize vocabulary with all characters. (2) Find most frequent pair in corpus. (3) Merge that pair into a new symbol. (4) Repeat for V-vocab_size steps. Result: common words become single tokens; rare words split into subword pieces. Handles unknown words gracefully (byte-level BPE handles any Unicode)."},
{q:"What is positional embedding?",a:"Transformers have no inherent notion of position (attention treats all positions equally). Positional embeddings add position information to token embeddings. <b>Absolute (sinusoidal)</b>: fixed sin/cos of different frequencies (original paper). <b>Learned absolute</b>: trainable PE vectors. <b>Relative (RoPE, ALiBi)</b>: encodes relative distance between tokens — better for long contexts and length generalization."},
{q:"What is temperature in LLMs?",a:"Temperature T scales logits before softmax: softmax(z/T). T=1: normal distribution. T<1: sharpens distribution (more greedy, deterministic, repetitive). T>1: flattens distribution (more random, creative, diverse). T→0: argmax (always pick highest probability token). T→∞: uniform random. Typical: T=0.7-1.0 for conversation, T=0 for factual tasks, T=1.0+ for creative writing."},
{q:"What is causal masking?",a:"In decoder-only Transformers (GPT-style), causal masking prevents tokens from attending to future tokens. Implemented as a mask added before softmax: mask[i,j] = -∞ if j>i, else 0. Ensures autoregressive property — prediction of token t can only use tokens 0...t-1. Allows training on all positions simultaneously (teacher forcing) while maintaining the sequential generation property."},
{q:"What are skip (residual) connections?",a:"Skip connections add the input of a block to its output: y = F(x) + x. Key benefits: (1) prevent vanishing gradients — gradient can flow directly through the skip path. (2) Allow training of very deep networks (ResNet, 100+ layers). (3) Model learns residuals (small corrections) rather than full transformations — easier optimization. In Transformers: applied after attention and FFN: x = x + Attention(LN(x))."},
{q:"How does RoPE work?",a:"Rotary Position Embedding encodes absolute position by rotating Q and K vectors by position-dependent angles. Rotation angle for position m: m × θᵢ where θᵢ = 10000^(-2i/d). Key property: Q_m · K_n (after rotation) depends only on the relative position (m-n) — gives relative position encoding via absolute PE mechanism. Extrapolates better to longer contexts than learned PE. Used in LLaMA, Mistral, Falcon."},
{q:"What is RMSNorm?",a:"RMSNorm is a simplified layer normalization: RMSNorm(x) = (x / RMS(x)) × γ where RMS(x) = √(1/n · Σxᵢ²). Removes the mean subtraction (re-centering) step from LayerNorm — only re-scaling. Empirically performs comparably to LayerNorm with fewer operations (10-20% speedup). Used in LLaMA, T5, Mistral as a more efficient alternative."},
{q:"Why does Attention use Softmax?",a:"Softmax converts raw attention scores to a proper probability distribution (non-negative, sums to 1) used to weight Values. Properties: (1) amplifies large scores and suppresses small ones (winner-take-all at low temperature). (2) differentiable — enables backpropagation. (3) allows interpretation as 'how much to attend to each position'. Alternative: linear attention (removes softmax for speed) but typically worse quality."},
{q:"What does a vector database store for LLM usage?",a:"Vector databases store high-dimensional embedding vectors and enable fast approximate nearest neighbor (ANN) search. For LLMs, they store embeddings of documents/chunks. During RAG: embed query → search vector DB for most similar document embeddings → retrieve top-k chunks → provide as context to LLM. Popular: Pinecone, Weaviate, Chroma, FAISS (library), Qdrant. Index types: HNSW (fast ANN), IVF."},
{q:"What is the context window in LLMs?",a:"The context window is the maximum number of tokens an LLM can process at once (input + output combined). Determines: how much text the model can 'see' at once; maximum document length; conversation history it can remember. Typical values: GPT-4: 128K, Claude 3.5: 200K, Gemini 1.5: 1M+. Limited by quadratic memory of attention. Techniques to extend: RoPE scaling, sliding window attention, sparse attention."},
{q:"Explain Prompting, RAG, and Fine-Tuning.",a:"<b>Prompting</b>: craft input text to guide model behavior. Zero-cost but limited by model's existing knowledge. Best for: general tasks the model already knows.<br><b>RAG</b>: retrieve relevant documents and add to context. Grounds model in current/private knowledge. Best for: knowledge-intensive tasks, up-to-date info.<br><b>Fine-tuning</b>: update model weights on task data. Best for: specific style/format, specialized domain knowledge, efficiency."},
{q:"What is Mixture of Experts (MoE)?",a:"MoE replaces the dense FFN in each Transformer block with multiple 'expert' FFNs and a router. The router selects top-k experts (usually 2 out of 8-64) for each token. Only selected experts compute — sparse activation. Result: much larger model capacity (more parameters) with similar compute cost as a dense model of expert size. Examples: Mixtral 8×7B (capacity of 46B, compute of 12B), GPT-4 (reportedly MoE)."},
{q:"What is the difference between dense and sparse models?",a:"<b>Dense models</b>: every parameter is used for every input. All FFN neurons activated. Compute = parameter count (proportional). Examples: GPT-3, LLaMA, BERT.<br><br><b>Sparse models (MoE)</b>: only a subset of parameters activated per input (token). Total params >> active params. More efficient per compute unit; need more memory for all experts; expert load balancing is a challenge."},
{q:"How can Transformers understand images (ViT)?",a:"Vision Transformer (ViT): split image into fixed-size patches (e.g., 16×16 pixels). Flatten each patch into a vector. Linear projection to model dimension. Add learnable [CLS] token and positional embeddings. Feed into standard Transformer encoder. Use [CLS] token output for classification. Requires large datasets (pretraining on ImageNet-21K or JFT). Swin Transformer adds hierarchical structure + shifted windows for dense prediction tasks."},
{q:"How do you improve inference speed in production LLM deployments?",a:"(1) KV caching — avoid recomputation. (2) Quantization (INT8, INT4) — faster compute, less memory. (3) Flash Attention — IO-efficient attention. (4) Batching requests — process multiple users together. (5) Continuous batching (vLLM) — efficient GPU utilization. (6) Speculative decoding — draft model proposes tokens, main model verifies in parallel. (7) Tensor parallelism — split model across GPUs. (8) Model distillation."},

{q:"What are Precision, Recall, F1, and Accuracy?",a:"<b>Accuracy</b>: (TP+TN)/(TP+TN+FP+FN) — misleading for imbalanced data.<br><b>Precision</b>: TP/(TP+FP) — correctness of positive predictions.<br><b>Recall</b>: TP/(TP+FN) — coverage of actual positives.<br><b>F1</b>: 2·P·R/(P+R) — harmonic mean of precision and recall.<br><br>Use F1 for imbalanced classes. Precision when FP is costly (spam). Recall when FN is costly (cancer screening)."},
{q:"What is the confusion matrix?",a:"A confusion matrix is a table showing predicted vs actual labels. For binary: TN|FP / FN|TP. From it: Accuracy, Precision, Recall, F1, Specificity (TN/(TN+FP)). For multi-class: NxN matrix where rows=actual, columns=predicted. Diagonal = correct predictions. Off-diagonal = errors. Helps identify which classes are confused with each other."},
{q:"What are common evaluation metrics for Classification?",a:"Accuracy, Precision, Recall, F1 (macro/micro/weighted), ROC-AUC, PR-AUC (better for imbalanced), Log-Loss/Cross-Entropy (penalizes confident wrong predictions), Cohen's Kappa (adjusts for chance agreement), Matthews Correlation Coefficient (balanced, single number). Choose based on class balance and relative cost of FP vs FN."},
{q:"When would you use accuracy vs other metrics?",a:"Use <b>accuracy</b> only for balanced classes (each class has similar frequency). For <b>imbalanced datasets</b>: F1, AUC-ROC, PR-AUC. When FP is costly: precision (spam filter). When FN is costly: recall (disease detection). For probability calibration quality: log-loss/Brier score. For multi-class: macro-F1 (treats classes equally), micro-F1 (weights by support), weighted-F1."},
{q:"When would you use log loss vs accuracy?",a:"Log-loss penalizes confident wrong predictions: -log(p) for correct class. Use when: model outputs probabilities that matter (not just predicted class), calibration matters, you need a differentiable metric for model selection. Accuracy is discrete and doesn't capture confidence. Log-loss rewards well-calibrated models. Use in: probability-based ranking, ensemble weighting, any task where predicted probabilities are used downstream."},
{q:"What metrics for multi-class classification?",a:"<b>Macro-averaged</b>: compute metric per class, then average — treats all classes equally (good when minority class matters). <b>Micro-averaged</b>: aggregate TP/FP/FN across all classes then compute — dominated by frequent classes. <b>Weighted</b>: weighted by class support. Also: confusion matrix for error pattern analysis, per-class precision/recall, top-k accuracy for ranking tasks."},
{q:"How do you handle class imbalance in classification metrics?",a:"Avoid accuracy. Use: F1-macro (treats all classes equally), AUC-ROC (threshold-independent, handles imbalance), PR-AUC (better than ROC for very imbalanced — focuses on minority class), G-mean (geometric mean of sensitivity and specificity). Report metrics per class. Also: collect more minority data, use SMOTE, adjust class weights, tune decision threshold."},
{q:"What is the ROC curve and AUC?",a:"ROC plots TPR (recall) vs FPR (1-specificity) at every classification threshold [0,1]. Each point = different threshold. AUC = area under ROC = probability that model ranks a random positive higher than a random negative. AUC=0.5: random; AUC=1.0: perfect. Advantage: threshold-independent, handles class imbalance. PR curve (precision vs recall) is more informative for very imbalanced datasets."},
{q:"How do you handle imbalanced datasets?",a:"Data level: SMOTE (synthetic minority oversampling), random undersampling, ADASYN. Algorithm level: class_weight='balanced' in sklearn, focal loss. Threshold level: move decision threshold from 0.5 to minimize cost. Evaluation: use AUC, F1, PR curve — not accuracy. Feature level: gather more minority examples. Ensemble: BalancedBaggingClassifier, EasyEnsemble."},
{q:"What are common evaluation metrics for Regression?",a:"<b>MAE</b>: mean absolute error — intuitive, robust to outliers. <b>MSE</b>: mean squared error — penalizes large errors more, differentiable. <b>RMSE</b>: root MSE — same units as target. <b>R²</b>: proportion of variance explained [0,1]. <b>MAPE</b>: mean absolute percentage error — relative error, fails when target≈0. <b>Huber loss</b>: MSE for small errors, MAE for large — robust to outliers."},
{q:"What's the difference between MAE, MSE, and RMSE?",a:"<b>MAE</b>: average |y-ŷ|. Robust to outliers, easy to interpret, not differentiable at 0.<br><b>MSE</b>: average (y-ŷ)². Penalizes large errors heavily, differentiable, sensitive to outliers. Units are squared.<br><b>RMSE</b>: √MSE. Same units as target, penalizes large errors. Most common regression metric. MAE ≤ RMSE always. Large gap → outliers present. Choose MSE/RMSE when large errors are unacceptable; MAE when errors treated equally."},
{q:"How do you choose the right evaluation metric?",a:"Consider: (1) Business objective — what error is actually costly? (2) Data distribution — balanced or imbalanced? (3) Output type — class, probability, or continuous? (4) Stakeholder understanding — can they interpret it? (5) Threshold sensitivity — fixed or variable? Use multiple metrics during development. Choose one primary metric for model selection. Always validate that the metric aligns with business value."},
{q:"How do you compare performance of different models?",a:"(1) Use same train/test/val splits for all. (2) Statistical significance testing (paired t-test, Wilcoxon on cross-validation results). (3) Compare multiple metrics, not just one. (4) Consider confidence intervals (bootstrap). (5) Account for model complexity (regularization, parameters). (6) Consider inference speed, memory, and deployment constraints. (7) Use error analysis — understand where each model fails."},
{q:"What is Hyperparameter Tuning?",a:"The process of finding optimal hyperparameters (settings not learned from data): learning rate, number of layers, regularization strength, batch size, etc. Methods: manual search, grid search, random search, Bayesian optimization, evolutionary methods. Tools: Optuna, Ray Tune, Weights&Biases sweeps. Always tune on validation set, evaluate on held-out test set. Use early stopping for efficiency."},
{q:"How do you evaluate unsupervised learning models?",a:"No ground truth labels, so harder to evaluate. Methods: (1) Intrinsic: within-cluster cohesion (inertia, silhouette score), between-cluster separation. (2) Extrinsic: if labels available, use ARI, NMI. (3) Reconstruction error for autoencoders. (4) Density estimation log-likelihood. (5) Downstream task performance. (6) Human evaluation / visual inspection (t-SNE visualization)."},
{q:"How do you evaluate a clustering algorithm?",a:"<b>Silhouette score</b>: (b-a)/max(a,b) where a=intra-cluster distance, b=nearest-cluster distance. Range [-1,1]. Higher=better. <b>Davies-Bouldin Index</b>: ratio of within-cluster to between-cluster distance. Lower=better. <b>Calinski-Harabasz</b>: between-cluster dispersion / within-cluster dispersion. Higher=better. If ground truth exists: Adjusted Rand Index, Normalized Mutual Information."},
{q:"What metrics for recommendation systems?",a:"<b>Precision@K</b>: fraction of top-K recs that are relevant. <b>Recall@K</b>: fraction of relevant items in top-K. <b>NDCG@K</b>: normalized discounted cumulative gain — rewards relevant items appearing higher in ranking. <b>MAP</b>: mean average precision. <b>Hit Rate@K</b>: did user interact with any of top-K? <b>MRR</b>: mean reciprocal rank. Business metrics: CTR, conversion rate, revenue lift."},
{q:"What is A/B testing in ML?",a:"A/B testing is a controlled experiment that randomly splits users into control (A, current model) and treatment (B, new model) groups. Statistical test determines if observed difference is significant. Key principles: random assignment, sufficient sample size (power analysis), single metric primary endpoint, guard against multiple comparison issues. In ML: test new model in shadow mode first, then gradual rollout, monitor for regression."},
